<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HOH Family">
<title>HOH Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Tithe.ly-style admin — top bar with area tabs, left sub-navigation, white work surface; church plum/magenta replaces teal. Phone: top bar + drawer + bottom tabs. */
:root{
  --bg:#f5f2fc; --surface:#ffffff; --surface2:#faf8fe; --head:#efe9fb; --line:#e6def5; --line2:#d3c5ef;
  --fg:#1f1730; --muted:#655a7a; --dim:#988db0;
  --brand:#6d28d9; --brand2:#c026d3; --plum:#2e1065; --tint:rgba(124,58,237,.09); --tint2:rgba(109,40,217,.15);
  --ok:#14804a; --okbg:#e3f5ea; --warn:#9a5b00; --warnbg:#fff3d9; --crit:#c0263d; --critbg:#fde7ea; --info:#1f5fa8; --infobg:#e6f0fb; --off:#5b5560; --offbg:#ecebee; --note:#fffbe9;
  --shadow:0 1px 2px rgba(46,16,101,.06),0 4px 14px rgba(46,16,101,.05);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --bg:#000; --surface:#0d0a14; --surface2:#13101c; --head:#171226; --line:#251f33; --line2:#372e4a;
  --fg:#f1ecfb; --muted:#b2a8c8; --dim:#7c7194;
  --brand:#b794ff; --brand2:#e879f9; --plum:#1e0b3a; --tint:rgba(183,148,255,.12); --tint2:rgba(183,148,255,.22);
  --ok:#4fd18b; --okbg:rgba(79,209,139,.12); --warn:#ffc15c; --warnbg:rgba(255,193,92,.12); --crit:#ff6b80; --critbg:rgba(255,107,128,.13); --info:#7fb4ff; --infobg:rgba(127,180,255,.12); --off:#b6aebb; --offbg:rgba(182,174,187,.12); --note:rgba(255,215,90,.08);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#000; --surface:#0d0a14; --surface2:#13101c; --head:#171226; --line:#251f33; --line2:#372e4a;
  --fg:#f1ecfb; --muted:#b2a8c8; --dim:#7c7194;
  --brand:#b794ff; --brand2:#e879f9; --plum:#1e0b3a; --tint:rgba(183,148,255,.12); --tint2:rgba(183,148,255,.22);
  --ok:#4fd18b; --okbg:rgba(79,209,139,.12); --warn:#ffc15c; --warnbg:rgba(255,193,92,.12); --crit:#ff6b80; --critbg:rgba(255,107,128,.13); --info:#7fb4ff; --infobg:rgba(127,180,255,.12); --off:#b6aebb; --offbg:rgba(182,174,187,.12); --note:rgba(255,215,90,.08);
  --shadow:none; color-scheme:dark}
:root[data-mode="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
a{color:var(--brand)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:64px;display:flex;align-items:center;gap:14px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);flex:none;background:none;border:0;cursor:pointer;padding:0}
.logo img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--tint2)}
.logo b{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--brand)}
.logo b span{color:var(--fg);font-weight:700}
.areas{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.area{border:0;background:none;padding:8px 15px;border-radius:99px;font-weight:600;color:var(--fg);cursor:pointer;white-space:nowrap}
.area:hover{background:var(--tint)}
.area.on{background:var(--brand);color:#fff}
.tb-right{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--brand);border-color:var(--line2)}
.iconbtn svg{width:19px;height:19px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;display:grid;place-items:center;border:0;cursor:pointer;font-size:13px}
.burger{display:none}

/* frame */
.frame{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100% - 64px)}
.subnav{padding:18px 12px;border-right:1px solid var(--line);background:var(--surface2);position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px);overflow-y:auto}
.subnav h6{margin:4px 12px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.sn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--fg);cursor:pointer;text-align:left;font-weight:500;margin-bottom:2px}
.sn svg{width:19px;height:19px;color:var(--muted);flex:none}
.sn:hover{background:var(--tint)}
.sn.on{background:var(--tint2);color:var(--brand);font-weight:700}
.sn.on svg{color:var(--brand)}
.sn .ct{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.verse{margin:18px 8px 0;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.verse q{display:block;color:var(--fg);font-style:italic;margin-bottom:6px;quotes:none}
main{min-width:0;padding-inline:clamp(16px,2.6vw,32px);padding-block:22px 110px}

/* page */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;text-wrap:balance}
.ph h1 svg{width:30px;height:30px;color:var(--brand)}
.ph .sub{color:var(--muted);margin-top:4px;font-size:13.5px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h2{margin:0;font-size:15px;font-weight:800}
.card>.hd .n{color:var(--muted);font-size:12.5px;font-weight:600}
.card>.bd{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stack{display:flex;flex-direction:column;gap:16px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;color:inherit;font:inherit}
button.stat{cursor:pointer}button.stat:hover{border-color:var(--brand)}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}
.stat.brand{background:linear-gradient(135deg,var(--plum),var(--brand));border-color:transparent;color:#fff}
.stat.brand .l{color:rgba(255,255,255,.82)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-crit{color:var(--crit)}.c-info{color:var(--info)}.c-brand{color:var(--brand)}.muted{color:var(--muted)}.small{font-size:12.5px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:22px 24px;color:#fff;background:linear-gradient(125deg,#2e1065 0%,#6d28d9 52%,#a21caf 100%);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);animation:drift 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(-40px,30px)}}
.hero img{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.hero h2{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:800}
.hero p{margin:4px 0 0;opacity:.88;max-width:70ch}
.hero .qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.24)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08);background:var(--brand)}
.btn.ghost{border-color:var(--line2);color:var(--fg)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-width:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.in{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;color:var(--fg)}
textarea.in{min-height:84px;resize:vertical;line-height:1.5}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--tint)}
select.in{padding-right:28px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
label.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;color:var(--fg);cursor:pointer}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;min-width:0}
legend{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:800;padding:0 6px}
.calc{background:var(--surface2);border:1px dashed var(--line2);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--fg);min-height:36px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--offbg);color:var(--off)}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-crit{background:var(--critbg);color:var(--crit)}.p-info{background:var(--infobg);color:var(--info)}.p-brand{background:var(--tint2);color:var(--brand)}.p-off{background:var(--offbg);color:var(--off)}
.gap{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--warnbg);color:var(--warn);margin:2px 4px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--fg)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip b{font-weight:800;margin-left:4px}

/* list engine */
.lt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.lt .search{flex:1 1 220px;position:relative}
.lt .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.lt .search .in{padding-left:32px}
.lt select.in{width:auto;max-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:800;color:var(--fg);background:var(--head);padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--brand)}
th .ar{opacity:.35;margin-left:4px;font-size:10px}th[aria-sort] .ar{opacity:1;color:var(--brand)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
tr.rw{cursor:pointer}tr.rw:hover td{background:var(--tint)}
td .t{font-weight:700}td .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.num{text-align:right}
.lf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.pg{display:flex;gap:6px;align-items:center}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px;font-size:14px}
@media (max-width:760px){
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border-bottom:1px solid var(--line);padding:10px 4px}
  table.rt td{border:0;padding:3px 12px;display:flex;gap:10px;justify-content:space-between;text-align:right}
  table.rt td::before{content:attr(data-l);font-weight:700;color:var(--muted);font-size:12px;text-align:left;flex:none}
  table.rt td.first{display:block;text-align:left}
  table.rt td.first::before{display:none}
}

/* rows (dashboard lists) */
.rows{display:flex;flex-direction:column}
.ri{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer;color:inherit}
.ri:last-child{border-bottom:0}
.ri:hover{background:var(--tint)}
.dt{width:46px;text-align:center;border-radius:10px;border:1px solid var(--line);padding:4px 0;background:var(--surface2)}
.dt b{display:block;font-size:17px;line-height:1.1}.dt span{font-size:10px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.08em}
.ri .t{font-weight:700;overflow-wrap:anywhere}.ri .m{color:var(--muted);font-size:12.5px}
.ri .r{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* order of service (Tithe.ly plan) */
.plan-meta{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.sec{border-bottom:1px solid var(--line)}
.sech{display:grid;grid-template-columns:28px 1fr 160px 80px 80px 72px;gap:10px;align-items:center;padding:12px 18px;background:var(--head);font-weight:800}
.oi{display:grid;grid-template-columns:28px 28px 1fr 160px 80px 80px 72px;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.oi.note{background:var(--note);grid-template-columns:28px 28px 1fr 72px}
.oi .ttl{font-weight:600}.oi .ds{color:var(--muted);font-size:12.5px}
.oi .tm,.sech .tm{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.key{display:inline-block;font-size:10.5px;font-weight:800;background:var(--offbg);border-radius:6px;padding:1px 6px;margin-left:6px;color:var(--fg)}
.ico{width:22px;height:22px;color:var(--brand)}
.mv{display:flex;gap:2px;justify-content:flex-end}
.mv button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.mv button:hover{color:var(--brand);border-color:var(--brand)}
.mv svg{width:13px;height:13px}
.show-sm{display:none}@media (max-width:760px){.show-sm{display:inline}}
.addrow{display:flex;gap:10px;justify-content:center;padding:16px;flex-wrap:wrap}
@media (max-width:760px){.sech{grid-template-columns:1fr auto}.sech .hide-sm{display:none}.oi{grid-template-columns:24px 1fr auto}.oi .hide-sm{display:none}.oi.note{grid-template-columns:24px 1fr auto}}
.run{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px))}
.run .now{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.run .now small{color:#ff8fd0;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.run .now h2{font-size:clamp(30px,6vw,64px);margin:0;line-height:1.05}
.run .now p{font-size:clamp(16px,2.4vw,24px);color:#cbbfd0;margin:0}
.run .nx{border-top:1px solid #333;padding-top:14px;color:#aaa;font-size:18px}
.run .clock{font-size:clamp(22px,4vw,40px);font-weight:800;font-variant-numeric:tabular-nums}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dn{padding:8px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--head)}
.cal .d{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.cal .d:hover{background:var(--tint)}
.cal .d.out{background:var(--surface2);color:var(--dim)}
.cal .d.today .no{background:var(--brand);color:#fff}
.cal .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700}
.ev{display:block;font-size:11px;font-weight:700;border-radius:5px;padding:2px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--tint2);color:var(--brand)}
.ev.ok{background:var(--okbg);color:var(--ok)}.ev.crit{background:var(--critbg);color:var(--crit)}.ev.off{background:var(--offbg);color:var(--off)}.ev.info{background:var(--infobg);color:var(--info)}.ev.warn{background:var(--warnbg);color:var(--warn)}
.clash{color:var(--crit);font-size:10px;font-weight:800}
@media (max-width:760px){.cal .d{min-height:62px;padding:3px}.ev{font-size:0;height:6px;padding:0;margin-top:2px}.cal .dn{font-size:9px;padding:6px 2px;text-align:center}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,6,28,.5);display:flex;justify-content:flex-end}
.sheet{width:min(680px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:sl .22s ease-out}
@keyframes sl{from{transform:translateX(24px);opacity:.5}}
.sheet header{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet header h3{margin:0;font-size:17px;flex:1;min-width:0}
.sheet .body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.sheet footer{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;min-width:230px}
.menu .mi{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--fg)}
.menu .mi:hover{background:var(--tint)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--plum);color:#fff;font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;max-width:90vw;text-align:center}

/* letter preview */
.letter{background:#fff;color:#1d1420;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:34px 40px;max-width:760px;margin:0 auto;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.6}
.letter .lh{display:flex;gap:18px;align-items:center;border-bottom:3px solid #8a1a6c;padding-bottom:12px;margin-bottom:18px}

/* counters (ushers) */
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ctr{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--surface2)}

.ctr .bt button.plus{background:var(--brand);color:#fff;border-color:var(--brand)}
.ctr input{width:80px;text-align:center;margin:0 auto}

/* timeline */
.tl{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line2);margin-left:8px;padding-left:16px}
.tl .e{position:relative}
.tl .e::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--surface)}
.matrix td,.matrix th{padding:7px 8px;text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix select{width:auto;padding:4px 6px}

/* mobile */
.bottom{display:none}
.drawer{position:fixed;inset:0;z-index:55;background:rgba(12,6,28,.5)}
.drawer .in2{position:absolute;left:0;top:0;bottom:0;width:min(320px,86vw);background:var(--surface);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 30px;animation:dl .2s ease-out}
@keyframes dl{from{transform:translateX(-30px);opacity:.5}}

body{background:radial-gradient(1200px 600px at 10% -10%,rgba(124,58,237,.10),transparent 60%),radial-gradient(900px 500px at 110% 10%,rgba(192,38,211,.08),transparent 60%),var(--bg);background-attachment:fixed}

// ================= list engine =================
const LST={},LCFG={},LSEL={};
function lstate(key,cfg){if(!LST[key])LST[key]=LS.get("l:"+key,{q:"",sort:cfg.sort||"",dir:cfg.dir||"asc",size:25,page:0,f:{},chip:cfg.chip||""});return LST[key];}
function lsave(key){LS.set("l:"+key,{...LST[key],page:0});}
function lrows(key,cfg){const st=lstate(key,cfg);let R=cfg.rows.slice();
  if(cfg.chips&&st.chip){const c=cfg.chips.find(c=>c.k===st.chip);if(c)R=R.filter(c.test);}
  for(const fl of cfg.filters||[]){const v=st.f[fl.k];if(v!==undefined&&v!=="")R=R.filter(r=>String(fl.get(r)??"")===v);}
  if(st.q){const q=st.q.toLowerCase();R=R.filter(r=>(cfg.text?cfg.text(r):cfg.cols.map(c=>c.get(r)).join(" ")).toLowerCase().includes(q));}
  const col=cfg.cols.find(c=>c.k===st.sort);
  if(col){const g=col.sv||col.get;R.sort((a,b)=>{let x=g(a),y=g(b);const e1=x===""||x==null,e2=y===""||y==null;if(e1&&e2)return 0;if(e1)return 1;if(e2)return -1;
    const r=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),undefined,{numeric:true});return st.dir==="desc"?-r:r;});}
  return R;}
function LT(key,cfg){LCFG[key]=cfg;const st=lstate(key,cfg);const R=lrows(key,cfg);const size=st.size==="All"?R.length||1:Number(st.size);const pages=Math.max(1,Math.ceil(R.length/size));if(st.page>=pages)st.page=pages-1;
  const V=R.slice(st.page*size,st.page*size+size);const bulk=!!cfg.coll&&(cfg.canBulk!=null?!!cfg.canBulk:!!cfg.mod&&canE(cfg.mod));const sel=LSEL[key]=LSEL[key]||new Set();
  for(const id of [...sel])if(!cfg.rows.some(r=>r._id===id))sel.delete(id);
  const fo=fl=>{const o=typeof fl.opts==="function"?fl.opts():fl.opts||[...new Set(cfg.rows.map(fl.get).filter(v=>v!==""&&v!=null))].sort();return `<select class="in" data-lf="${key}|${fl.k}" aria-label="${esc(fl.label)}"><option value="">${esc(fl.label)}: All</option>${o.map(v=>`<option ${st.f[fl.k]===String(v)?"selected":""} value="${esc(v)}">${esc(v)}</option>`).join("")}</select>`;};
  const chips=cfg.chips?`<div class="chips" style="padding:12px 14px 0">${cfg.chips.map(c=>`<button class="chip ${st.chip===c.k?"on":""}" data-lchip="${key}|${c.k}">${esc(c.label)}<b>${cfg.rows.filter(c.test).length}</b></button>`).join("")}</div>`:"";
  const allOn=V.length&&V.every(r=>sel.has(r._id));
  const bar=bulk&&sel.size?`<div class="bulkbar"><b>${sel.size} selected</b><button class="btn sm ghost" data-lselall="${key}">Select all ${R.length} shown</button><button class="btn sm ghost" data-lselnone="${key}">Clear</button><span style="flex:1"></span>${bulkFields(cfg).length?`<button class="btn sm" data-lbset="${key}">${ic("edit")}Change a field</button>`:""}${dl?`<button class="btn sm ghost" data-lcsv="${key}" data-only="1">${ic("dl")}Export selected</button>`:""}<button class="btn sm danger" data-lbdel="${key}">${ic("trash")}Delete</button></div>`:"";
  return `<div class="card">${chips}<div class="lt"><div class="search">${ic("search")}<input class="in" id="lq_${key}" data-lq="${key}" placeholder="${esc(cfg.ph||"Search…")}" value="${esc(st.q)}" aria-label="Search"></div>${(cfg.filters||[]).map(fo).join("")}
   <select class="in" data-lsize="${key}" aria-label="Rows to show">${[10,25,50,100,"All"].map(s=>`<option ${String(st.size)===String(s)?"selected":""} value="${s}">Show ${s}</option>`).join("")}</select>${dl?`<button class="btn ghost sm" data-lcsv="${key}" title="Download this list">${ic("dl")}Export</button>`:""}${bulk?`<button class="btn ghost sm" data-limport="${key}" title="Upload many rows from Excel or CSV">${ic("up")}Bulk upload</button>`:""}</div>${bar}
  ${R.length?`<div class="tw"><table class="rt"><thead><tr>${bulk?`<th style="width:34px"><input type="checkbox" data-lpage="${key}" ${allOn?"checked":""} aria-label="Select all on this page"></th>`:""}${cfg.cols.map(c=>`<th class="${c.nosort?"":"s"} ${c.num?"num":""}" ${c.nosort?"":`data-lsort="${key}|${c.k}"`} ${st.sort===c.k?`aria-sort="${st.dir==="asc"?"ascending":"descending"}"`:""}>${esc(c.label)}${c.nosort?"":`<span class="ar">${st.sort===c.k?(st.dir==="asc"?"▲":"▼"):"↕"}</span>`}</th>`).join("")}</tr></thead>
   <tbody>${V.map(r=>`<tr class="${cfg.open?"rw":""} ${sel.has(r._id)?"selrow":""}" ${cfg.open?cfg.open(r):""}>${bulk?`<td class="ck" data-l="Select"><input type="checkbox" data-lsel="${key}|${esc(r._id)}" ${sel.has(r._id)?"checked":""} aria-label="Select"></td>`:""}${cfg.cols.map((c,i)=>`<td class="${i===0?"first":""} ${c.num?"num":""}" data-l="${esc(c.label)}">${c.html?c.html(r):esc(c.get(r)??"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
   <div class="lf"><span>Showing ${st.page*size+1}–${Math.min(R.length,st.page*size+size)} of ${R.length}${R.length!==cfg.rows.length?` (filtered from ${cfg.rows.length})`:""}</span>${pages>1?`<div class="pg"><button class="btn ghost sm" data-lpg="${key}|${st.page-1}" ${st.page===0?"disabled":""}>Previous</button><span>Page ${st.page+1} of ${pages}</span><button class="btn ghost sm" data-lpg="${key}|${st.page+1}" ${st.page>=pages-1?"disabled":""}>Next</button></div>`:""}</div>`
  :`<div class="empty"><b>${esc(cfg.rows.length?"Nothing matches":(cfg.emptyT||"Nothing here yet"))}</b>${esc(cfg.rows.length?"Clear the search or filters to see everything.":(cfg.emptyM||""))}</div>`}</div>`;}
function lcsv(key,only){const cfg=LCFG[key];if(!cfg||!dl)return;let R=lrows(key,cfg);if(only)R=R.filter(r=>(LSEL[key]||new Set()).has(r._id));const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=[cfg.cols.map(c=>q(c.label)).join(","),...R.map(r=>cfg.cols.map(c=>q(c.csv?c.csv(r):c.get(r))).join(","))].join("\r\n");
  saveFile(`${key}_${tISO()}.csv`,new Blob(["﻿"+csv],{type:"text/csv"}));}
async function saveFile(name,data){if(!dl){toast("Downloads aren't available here");return;}try{await dl.save({filename:name,data});}catch(e){if(e&&!["cancelled","declined"].includes(e.code))toast("The file was not saved");}}
const schemaOf=cfg=>SC[cfg.schema||cfg.coll];
function bulkFields(cfg){const sc=schemaOf(cfg);if(!sc)return[];return sc.groups.flatMap(g=>g[1]).filter(f=>f[2]&&(f[2].startsWith("sel:")||f[2].startsWith("multi:")||f[2]==="team"||f[2]==="date"));}
function bulkSetSheet(key){const cfg=LCFG[key];const fs=bulkFields(cfg);const n2=LSEL[key].size;
  sheet({title:`Change a field on ${n2} record${n2===1?"":"s"}`,body:`<label class="f">Field<select class="in" id="bsF">${fs.map(f=>`<option value="${f[0]}">${esc(f[1])}</option>`).join("")}</select></label><div id="bsV"></div>`,foot:`<span style="flex:1"></span><button class="btn ghost" data-close="1">Cancel</button><button class="btn pri" id="bsGo">Apply to ${n2}</button>`});
  const draw=()=>{const f=fs.find(x=>x[0]===document.getElementById("bsF").value);document.getElementById("bsV").innerHTML=fieldHTML([ "bsval","New value",f[2]],{},false);};draw();document.getElementById("bsF").onchange=draw;
  document.getElementById("bsGo").onclick=async()=>{const k=document.getElementById("bsF").value,f0=fs.find(x=>x[0]===k)||[];const v=String(f0[2]||"").startsWith("multi:")?readMulti("f_bsval").join(", "):document.getElementById("f_bsval").value;const b=document.getElementById("bsGo");b.disabled=true;let c=0;
    for(const id of LSEL[key]){const r=cfg.rows.find(x=>x._id===id);if(!r)continue;const d={...r,[k]:v};delete d._id;if(await save(cfg.coll,id,d,{quiet:true,log:false}))c++;}
    logAct("bulk update",cfg.coll,"",`${k} = ${v} on ${c} records`);toast(`${c} updated`);LSEL[key].clear();closeLayer();render();};}
async function bulkDelete(key){const cfg=LCFG[key];const ids=[...LSEL[key]];if(!confirmArm("bd"+key)){toast(`Tap Delete again to remove ${ids.length} record${ids.length===1?"":"s"}`);return;}let c=0;
  for(const id of ids)if(await del(cfg.coll,id,{quiet:true}))c++;logAct("bulk delete",cfg.coll,"",`${c} records`);toast(`${c} deleted`);LSEL[key].clear();render();}
function importSheet(key){const cfg=LCFG[key];const sc=schemaOf(cfg);const fields=sc.groups.flatMap(g=>g[1]);
  sheet({title:`Bulk upload – ${sc.name.toLowerCase()}s`,body:`<p class="small muted" style="margin:0">Upload an Excel (.xlsx) or CSV file with a header row. Columns are matched to fields by name – you can adjust the matching before importing. Tip: export this list first to get a ready template.</p>
   <label class="btn" style="align-self:flex-start;cursor:pointer">${ic("up")}Choose file<input type="file" id="impF" accept=".csv,.xlsx,.xls" hidden></label><div id="impArea"></div>`,foot:`<span style="flex:1"></span><button class="btn ghost" data-close="1">Cancel</button><button class="btn pri" id="impRun" disabled>Import</button>`});
  let data=[],map={};
  document.getElementById("impF").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!await loadLib("xlsx","https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"))return;
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];data=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
    if(!data.length){document.getElementById("impArea").innerHTML=`<div class="empty">That file has no rows.</div>`;return;}
    const heads=Object.keys(data[0]);const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
    heads.forEach(h=>{const m=fields.find(f=>norm(f[1])===norm(h)||norm(f[0])===norm(h)||norm(f[1]).startsWith(norm(h))&&norm(h).length>3);map[h]=m?m[0]:"";});
    const drawMap=()=>{document.getElementById("impArea").innerHTML=`<div class="card"><div class="hd"><h2>${data.length} rows found</h2><span class="n">match each column</span></div><div class="tw"><table><thead><tr><th>Column in your file</th><th>Example</th><th>Goes into</th></tr></thead><tbody>${heads.map(h=>`<tr><td><b>${esc(h)}</b></td><td class="small muted">${esc(String(data[0][h]).slice(0,40))}</td><td><select class="in" data-imap="${esc(h)}"><option value="">— Skip —</option>${fields.map(f=>`<option value="${f[0]}" ${map[h]===f[0]?"selected":""}>${esc(f[1])}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></div>`;
      document.querySelectorAll("[data-imap]").forEach(s=>s.onchange=()=>{map[s.dataset.imap]=s.value;});document.getElementById("impRun").disabled=false;};drawMap();};
  document.getElementById("impRun").onclick=async()=>{const b=document.getElementById("impRun");b.disabled=true;const types=Object.fromEntries(fields.map(f=>[f[0],f[2]||"text"]));let c=0,i=0;const ids=new Set(store(cfg.coll).map(r=>r._id));
    const conv=(v,t)=>{if(v instanceof Date)return t==="time"?`${String(v.getHours()).padStart(2,"0")}:${String(v.getMinutes()).padStart(2,"0")}`:iso(v);if(t==="num")return v===""?"":Number(v);if(t==="date"&&typeof v==="string"){const m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;}if(t==="chk")return /^(y|yes|true|1)$/i.test(String(v));return typeof v==="string"?v.trim():v;};
    for(const row of data){const d={...(cfg.importDefaults||{})};for(const[h,k]of Object.entries(map))if(k)d[k]=conv(row[h],types[k]);if(!Object.values(d).some(v=>v!==""&&v!=null))continue;
      let id;if(cfg.coll==="programs"){id=nextPid(d.date);while(ids.has(id)){const pre=id.slice(0,4);id=pre+String(parseInt(id.slice(4),10)+1).padStart(3,"0");}d.id=id;d.kind=d.kind||"Program";d.status=d.status||"Planning";}else if(cfg.coll==="actions"){id=nextSeq("actions","A",3);while(ids.has(id))id="A"+String(parseInt(id.slice(1),10)+1).padStart(3,"0");}else id=rid();
      ids.add(id);if(await save(cfg.coll,id,d,{quiet:true,log:false}))c++;i++;if(i%10===0)b.textContent=`Importing ${i}/${data.length}…`;}
    logAct("bulk upload",cfg.coll,"",`${c} records`);toast(`${c} record${c===1?"":"s"} imported`);closeLayer();render();};}

function openProposal(id){const rec=id?{...(S.proposals.find(x=>x._id===id)||{})}:{status:"Draft",byId:me.id,proposer:me.name||""};const isNew=!id;const st=rec.status||"Draft";
  const mine=isNew||rec.byId===me.id;const edit=canE("proposals")&&(mine||canE("approve"))&&!["Approved"].includes(st);const appr=canE("approve")&&!isNew;
  const def=SC.proposals;
  sheet({title:isNew?"Propose a program":rec.title||"Proposal",body:`${!isNew?`<div class="chips">${epill(st)}${rec.pid?`<button class="btn sm ghost" data-open="programs|${esc(rec.pid)}">Open program ${esc(rec.pid)}</button>`:""}</div>`:""}
   ${def.groups.map(([g,fs])=>`<fieldset><legend>${g}</legend>${fs.map(f=>fieldHTML(f,rec,!edit)).join("")}</fieldset>`).join("")}
   ${rec.review||appr?`<fieldset><legend>Review</legend><label class="f wide">Reviewer's notes<textarea class="in" id="f_review" ${appr?"":"disabled"}>${esc(rec.review||"")}</textarea></label>${rec.revBy?`<div class="small muted wide">Last reviewed by ${esc(who(rec.revBy))} on ${fmtS((rec.revAt||"").slice(0,10))}</div>`:""}</fieldset>`:""}`,
   foot:`${!isNew&&(mine||canE("approve"))&&canE("proposals")&&st!=="Approved"?`<button class="btn danger" id="pDel">${ic("trash")}Delete</button>`:""}<span style="flex:1"></span>
    ${edit?`<button class="btn ghost" data-pact="draft">Save draft</button><button class="btn pri" data-pact="submit">Submit for review</button>`:""}
    ${appr&&st!=="Approved"?`<button class="btn ghost" data-pact="review">Mark under review</button><button class="btn danger" data-pact="return">Return for changes</button><button class="btn danger" data-pact="decline">Decline</button><button class="btn pri" data-pact="approve">Approve & add to calendar</button>`:""}
    ${!edit&&!appr?`<button class="btn ghost" data-close="1">Close</button>`:""}`});
  const go2=async act=>{let d=edit?readForm(def.groups,rec):{...rec};delete d._id;if(!d.title){toast("Give the program a title first");return;}
    const rv=document.getElementById("f_review");if(rv)d.review=rv.value.trim();
    const did=id||rid();d.at=d.at||new Date().toISOString();d.byId=d.byId||me.id;

      if(!await save("programs",pid,prog,{quiet:true}))return;d.pid=pid;}

  document.querySelectorAll("[data-pact]").forEach(b=>b.onclick=()=>go2(b.dataset.pact));

let planDraft=null,planDirty=false,editItem=null;
function planPage(id){const src=S.plans.find(x=>x._id===id);if(!src)return `<div class="empty"><b>Loading order of service…</b></div>`;
  if(!planDraft||planDraft._id!==id||(!planDirty&&JSON.stringify(src)!==JSON.stringify(planDraft))){planDraft=JSON.parse(JSON.stringify(src));planDirty=false;}
  const pl=planDraft,ed=canE("oos");let t=pl.start||"08:00";const tot=planTotal(pl);
  const meta=`<div class="plan-meta"><span>Start: ${ed?`<input class="in" type="time" data-pm="start" value="${esc(pl.start||"")}" style="width:auto;display:inline-block">`:t12(pl.start)}</span><span>Duration: ${Math.floor(tot/60)?Math.floor(tot/60)+"h ":""}${tot%60}m</span><span>Ends: ${t12(addMin(pl.start||"08:00",tot))}</span>${pl.isTemplate?pill("Template","p-brand"):`<span>Date: ${ed?`<input class="in" type="date" data-pm="date" value="${esc(pl.date||"")}" style="width:auto;display:inline-block">`:fmt(pl.date)}</span>`}</div>`;
  const secs=(pl.sections||[]).map((s,si)=>{const sStart=t;const sTot=(s.items||[]).filter(i=>i.type!=="note").reduce((a,i)=>a+n(i.dur),0);
   const rows=(s.items||[]).map((it,ii)=>{const isE=editItem&&editItem[0]===si&&editItem[1]===ii;
    if(isE)return `<div class="oi" style="grid-template-columns:1fr"><div class="grid g3"><label class="f">Type<select class="in" id="ie_type">${L.ItemType.map(x=>`<option value="${x}" ${it.type===x?"selected":""}>${ITEM_LABEL[x]||x}</option>`).join("")}</select></label><label class="f">Title<input class="in" id="ie_title" value="${esc(it.title||"")}"></label><label class="f">Led by / anchor<input class="in" id="ie_lead" value="${esc(it.lead||"")}"></label><label class="f">Minutes<input class="in" type="number" id="ie_dur" value="${esc(it.dur)}"></label><label class="f">Key (songs)<input class="in" id="ie_key" value="${esc(it.key||"")}"></label><label class="f wide">Description / notes<input class="in" id="ie_desc" value="${esc(it.desc||"")}"></label></div><div class="chips" style="margin-top:8px;justify-content:flex-end"><button class="btn sm danger" data-ia="del|${si}|${ii}">${ic("trash")}Remove</button><button class="btn sm ghost" data-ia="cancel">Cancel</button><button class="btn sm pri" data-ia="ok|${si}|${ii}">Done</button></div></div>`;
    if(it.type==="note")return `<div class="oi note">${ed?`<div class="mv" style="flex-direction:column"><button data-ia="up|${si}|${ii}" aria-label="Move up">${ic("up")}</button><button data-ia="down|${si}|${ii}" aria-label="Move down">${ic("down")}</button></div>`:"<span></span>"}${ic("note","ico")}<i style="cursor:${ed?"pointer":"default"}" ${ed?`data-ia="edit|${si}|${ii}"`:""}>${esc(it.title||it.desc||"")}</i>${ed?`<div class="mv"><button data-ia="edit|${si}|${ii}" aria-label="Edit">${ic("edit")}</button></div>`:"<span></span>"}</div>`;
    const at=t;t=addMin(t,n(it.dur));
    return `<div class="oi">${ed?`<div class="mv" style="flex-direction:column"><button data-ia="up|${si}|${ii}" aria-label="Move up">${ic("up")}</button><button data-ia="down|${si}|${ii}" aria-label="Move down">${ic("down")}</button></div>`:"<span></span>"}${ic(it.type==="general"?"general":it.type,"ico")}
     <div style="min-width:0;cursor:${ed?"pointer":"default"}" ${ed?`data-ia="edit|${si}|${ii}"`:""}><div class="ttl">${esc(it.title||ITEM_LABEL[it.type])}${it.key?`<span class="key">${esc(it.key)}</span>`:""}</div><div class="ds">${esc([it.lead,it.desc].filter(Boolean).join(" – "))}</div></div>
     <div class="hide-sm muted small">${esc(it.lead||"")}</div><div class="tm hide-sm">${t12(at)}</div><div class="tm"><b class="show-sm">${t12(at)} · </b>${n(it.dur)}m</div>${ed?`<div class="mv hide-sm"><button data-ia="edit|${si}|${ii}" aria-label="Edit">${ic("edit")}</button></div>`:"<span></span>"}</div>`;}).join("");
   return `<div class="sec"><div class="sech">${ed?`<div class="mv" style="flex-direction:column"><button data-sa="up|${si}" aria-label="Move section up">${ic("up")}</button><button data-sa="down|${si}" aria-label="Move section down">${ic("down")}</button></div>`:"<span></span>"}
     <div>${ed?`<input class="in" data-sf="${si}|title" value="${esc(s.title||"")}" style="font-weight:800">`:esc(s.title)}</div><div class="hide-sm">${ed?`<input class="in" data-sf="${si}|lead" placeholder="Lead by" value="${esc(s.lead||"")}">`:`Lead by ${esc(s.lead||"—")}`}</div><div class="tm hide-sm">${t12(sStart)}</div><div class="tm">${sTot}m total</div>${ed?`<div class="mv"><button data-sa="del|${si}" aria-label="Delete section">${ic("trash")}</button></div>`:"<span></span>"}</div>${rows}
     ${ed?`<div class="addrow"><select class="in" id="addType_${si}" style="width:auto">${L.ItemType.map(x=>`<option value="${x}">${ITEM_LABEL[x]||x}</option>`).join("")}</select><button class="btn" data-ia="add|${si}">${ic("plus")}Add item</button></div>`:""}</div>`;}).join("");
  const p=progBy(pl.pid);
  return PH(esc(pl.title),"cal",`${pl.isTemplate?"Template":fmtLong(pl.date)}${p?` · <button class="btn sm ghost" data-open="programs|${esc(p._id)}">${esc(p.prog)}</button>`:""}${pl.location?" · "+esc(pl.location):""}`,
   `<button class="btn ghost" data-page="oos">Back</button>${btn(`${ic("play")}Run sheet`,'data-run="1"',"ghost")}${btn(`${ic("copy")}Copy text`,'data-plantext="1"',"ghost")}${dl?btn(`${ic("dl")}PDF`,'data-planpdf="1"',"ghost"):""}${ed?`${btn("Save as template",'data-plantpl="1"',"ghost")}${btn("Duplicate",'data-plandup="1"',"ghost")}<button class="btn danger" id="planDel">${ic("trash")}</button>`:""}`)+
  `${planDirty&&ed?`<div class="card" style="margin-bottom:12px;border-color:var(--brand)"><div class="bd flexb" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>You have unsaved changes</b><div class="chips"><button class="btn ghost" data-plandiscard="1">Discard</button><button class="btn pri" data-plansave="1">Save changes</button></div></div></div>`:""}
  <div class="card">${ed?`<div class="bd grid g3" style="border-bottom:1px solid var(--line)"><label class="f">Title<input class="in" data-pm="title" value="${esc(pl.title||"")}"></label><label class="f">Program<select class="in" data-pm="pid"><option value="">— None —</option>${sortP(S.programs).reverse().map(x=>`<option value="${esc(x._id)}" ${x._id===pl.pid?"selected":""}>${esc(fmtS(x.date))} · ${esc(x.prog)}</option>`).join("")}</select></label><label class="f">Location<input class="in" data-pm="location" value="${esc(pl.location||"")}"></label></div>`:""}
   ${meta}${secs||`<div class="empty">No sections yet.</div>`}${ed?`<div class="addrow"><button class="btn" data-sa="add">${ic("plus")}Section</button></div>`:""}</div>`;}
function planOp(kind,a){const pl=planDraft;if(!pl)return;const[op,si,ii]=a.split("|");const S2=pl.sections;const s=S2[+si];
  if(kind==="ia"){if(op==="cancel"){editItem=null;}
   else if(op==="edit"){editItem=[+si,+ii];}
   else if(op==="ok"){const it=s.items[+ii];it.type=document.getElementById("ie_type").value;it.title=document.getElementById("ie_title").value.trim();it.lead=document.getElementById("ie_lead").value.trim();it.dur=document.getElementById("ie_dur").value===""?"":Number(document.getElementById("ie_dur").value);it.key=document.getElementById("ie_key").value.trim();it.desc=document.getElementById("ie_desc").value.trim();editItem=null;planDirty=true;}
   else if(op==="del"){s.items.splice(+ii,1);editItem=null;planDirty=true;}
   else if(op==="up"&&+ii>0){[s.items[+ii-1],s.items[+ii]]=[s.items[+ii],s.items[+ii-1]];planDirty=true;}
   else if(op==="down"&&+ii<s.items.length-1){[s.items[+ii+1],s.items[+ii]]=[s.items[+ii],s.items[+ii+1]];planDirty=true;}
   else if(op==="add"){const ty=document.getElementById("addType_"+si).value;s.items=s.items||[];s.items.push({id:rid(),type:ty,title:ty==="note"?"":ITEM_LABEL[ty],lead:"",dur:ty==="note"?"":5,key:"",desc:""});editItem=[+si,s.items.length-1];planDirty=true;}}
  else{if(op==="add"){S2.push({id:rid(),title:"New section",lead:"",items:[]});}
   else if(op==="del"){if(s.items&&s.items.length&&!confirmArm("sec"+si)){toast("Tap delete again to remove this section and its items");return;}S2.splice(+si,1);}
   else if(op==="up"&&+si>0)[S2[+si-1],S2[+si]]=[S2[+si],S2[+si-1]];else if(op==="down"&&+si<S2.length-1)[S2[+si+1],S2[+si]]=[S2[+si],S2[+si+1]];planDirty=true;}
  render();}
const arms={};function confirmArm(k){if(arms[k]&&Date.now()-arms[k]<4000){delete arms[k];return true;}arms[k]=Date.now();return false;}
function planText(pl){let t=pl.start||"08:00";const L2=[`*${pl.title}*`,pl.isTemplate?"":fmtLong(pl.date),pl.location||"",""].filter((x,i)=>x||i===3);
  for(const s of pl.sections||[]){L2.push(`— ${s.title}${s.lead?` (Lead: ${s.lead})`:""} —`);for(const it of s.items||[]){if(it.type==="note"){L2.push(`   📝 ${it.title||it.desc}`);continue;}L2.push(`${t12(t)}  ${it.title||ITEM_LABEL[it.type]}${it.key?` [${it.key}]`:""}${it.lead?` – ${it.lead}`:""} (${n(it.dur)}m)${it.desc?`\n        ${it.desc}`:""}`);t=addMin(t,n(it.dur));}L2.push("");}
  L2.push(`Ends ${t12(t)} · ${planTotal(pl)} minutes`);return L2.join("\n");}
function runSheet(){const pl=planDraft;if(!pl)return;const items=[];let t=pl.start||"08:00";for(const s of pl.sections||[])for(const it of s.items||[]){if(it.type==="note")continue;items.push({...it,at:t,sec:s.title});t=addMin(t,n(it.dur));}
  let idx=0;const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};const toM=x=>{const[h,m]=x.split(":").map(Number);return h*60+m;};
  if(pl.date===tISO()){const nm=nowM();const k=items.findIndex((it,i)=>toM(it.at)<=nm&&(i===items.length-1||toM(items[i+1].at)>nm));if(k>=0)idx=k;}
  const draw=()=>{const it=items[idx]||{},nx=items[idx+1];const d=new Date();document.getElementById("layer").innerHTML=`<div class="run" role="dialog" aria-label="Run sheet"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="clock">${d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div><div style="display:flex;gap:8px"><button class="btn ghost" style="color:#fff;border-color:#555" id="rPrev">Previous</button><button class="btn pri" id="rNext">Next</button><button class="btn ghost" style="color:#fff;border-color:#555" id="rClose">Close</button></div></div>
   <div class="now"><small>${esc(it.sec||"")} · ${t12(it.at)} · ${n(it.dur)} min · ${idx+1} of ${items.length}</small><h2>${esc(it.title||"")}${it.key?` <span style="font-size:.4em;color:#ff8fd0">${esc(it.key)}</span>`:""}</h2><p>${esc([it.lead,it.desc].filter(Boolean).join(" — "))}</p></div><div class="nx">${nx?`Next at ${t12(nx.at)}: <b style="color:#fff">${esc(nx.title)}</b>${nx.lead?" — "+esc(nx.lead):""}`:"Last item"}</div></div>`;
   document.getElementById("rPrev").onclick=()=>{idx=Math.max(0,idx-1);draw();};document.getElementById("rNext").onclick=()=>{idx=Math.min(items.length-1,idx+1);draw();};document.getElementById("rClose").onclick=()=>{clearInterval(rt);closeLayer();};};
  const rt=setInterval(()=>{if(!document.querySelector(".run"))return clearInterval(rt);const c=document.querySelector(".run .clock");if(c)c.textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});},15000);draw();}

function remindRoster(){const ds=[...new Set(S.rosters.filter(r=>(r.date||"")>=tISO()).map(r=>r.date))].sort();const d0=ds[0]||tISO();
  const build=d=>{const rs=S.rosters.filter(r=>r.date===d).sort((a,b)=>(a.service||"").localeCompare(b.service||"")||(a.role||"").localeCompare(b.role||""));const by={};rs.forEach(r=>(by[r.service||"Service"]=by[r.service||"Service"]||[]).push(r));
   return `*${settings.churchSub} – duty roster*\n${fmtLong(d)}\n\n`+Object.entries(by).map(([s,x])=>`*${s}*\n`+x.map(r=>`• ${r.role}: ${r.person}`).join("\n")).join("\n\n")+`\n\nPlease be in church 30 minutes early. If you can't make it, request a swap in good time. God bless you.`;};
  shareSheet("Roster reminder",build(d0));const ta=document.getElementById("shareTxt");ta.insertAdjacentHTML("beforebegin",`<label class="f">Date<select class="in" id="rmDate">${(ds.length?ds:[d0]).map(d=>`<option value="${d}">${fmt(d)}</option>`).join("")}</select></label>`);
  document.getElementById("rmDate").onchange=e=>{ta.value=build(e.target.value);};}

let ctr=null;const CTRK=[["men","Men"],["women","Women"],["children","Children"],["ft","First-timers"],["nc","New converts"],["workers","Workers"]];
P.attendance=()=>{if(!ctr)ctr={date:tISO(),service:"Sunday Service",area:L.AttArea[0]||"",pid:"",notes:"",men:0,women:0,children:0,ft:0,nc:0,workers:0};
  const tot=n(ctr.men)+n(ctr.women)+n(ctr.children);const S2=attSeries();
  return PH("Attendance","count","Ushers submit headcounts here · totals and trends update instantly")+
  `${canE("attendance")?`<div class="card" style="margin-bottom:16px"><div class="hd"><h2>Submit a headcount</h2><span class="n">Total: <b style="color:var(--brand);font-size:16px">${tot}</b></span></div><div class="bd stack">
   <div class="grid g3"><label class="f">Date<input class="in" type="date" data-ctr="date" value="${esc(ctr.date)}"></label><label class="f">Service<select class="in" data-ctr="service">${L.Services.map(s=>`<option ${ctr.service===s?"selected":""}>${esc(s)}</option>`).join("")}</select></label><label class="f">Section<select class="in" data-ctr="area">${L.AttArea.map(s=>`<option ${ctr.area===s?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
    <label class="f">Program (optional)<select class="in" data-ctr="pid"><option value="">— None —</option>${sortP(S.programs.filter(p=>Math.abs(dtg(p)??999)<=14)).map(p=>`<option value="${esc(p._id)}" ${ctr.pid===p._id?"selected":""}>${esc(fmtS(p.date))} · ${esc(p.prog)}</option>`).join("")}</select></label></div>
   <div class="counters">${CTRK.map(([k,l])=>`<div class="ctr"><small>${l}</small><div class="v">${n(ctr[k])}</div><div class="bt"><button data-cnt="${k}|-1" aria-label="${l} minus one">−</button><button class="plus" data-cnt="${k}|1" aria-label="${l} plus one">+</button></div><input class="in" type="number" data-ctrn="${k}" value="${n(ctr[k])}" aria-label="${l} count" style="margin-top:8px"></div>`).join("")}</div>
   <label class="f">Notes<input class="in" data-ctr="notes" value="${esc(ctr.notes)}" placeholder="Anything worth noting (weather, overflow opened…)"></label>
   <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" data-ctrreset="1">Reset</button><button class="btn pri" data-ctrsave="1">Submit headcount</button></div></div></div>`:""}
  <div class="grid g2" style="margin-bottom:16px"><div class="card"><div class="hd"><h2>Trend</h2><span class="n">last 16 services</span></div><div class="bd">${attChart(16)}</div></div>
  <div class="card"><div class="hd"><h2>Averages</h2></div><div class="bd"><dl class="kv">${(()=>{const last=S2.slice(-8);const av=k=>last.length?Math.round(last.reduce((s,x)=>s+x[k],0)/last.length):0;const mx=S2.reduce((m,x)=>x.t>m.t?x:m,{t:0});return `<dt>Average (last 8)</dt><dd><b>${av("t")}</b></dd><dt>First-timers (last 8)</dt><dd>${last.reduce((s,x)=>s+x.ft,0)}</dd><dt>Highest ever</dt><dd>${mx.t?`${mx.t} · ${esc(mx.service)} · ${fmtS(mx.date)}`:"—"}</dd><dt>Reports logged</dt><dd>${S.attendance.length}</dd>`;})()}</dl></div></div></div>`+
  LT("attendance",{coll:"attendance",mod:"attendance",rows:S.attendance,sort:"date",dir:"desc",open:a=>`data-open="attendance|${esc(a._id)}"`,text:a=>[a.service,a.area,a.notes,progName(a.pid)].join(" "),
   cols:[{k:"date",label:"Date",get:a=>a.date||"",html:a=>`<b>${fmtS(a.date)}</b>`},{k:"service",label:"Service",get:a=>a.service||"",html:a=>`${esc(a.service||"")}<div class="m">${esc(a.area||"")}</div>`},{k:"men",label:"Men",num:1,get:a=>n(a.men)},{k:"women",label:"Women",num:1,get:a=>n(a.women)},{k:"children",label:"Children",num:1,get:a=>n(a.children)},{k:"tot",label:"Total",num:1,get:attTotal,html:a=>`<b>${attTotal(a)}</b>`},{k:"ft",label:"First-timers",num:1,get:a=>n(a.ft)},{k:"nc",label:"Converts",num:1,get:a=>n(a.nc)}],
   filters:[{k:"s",label:"Service",get:a=>a.service||""},{k:"ar",label:"Section",get:a=>a.area||""},{k:"y",label:"Year",get:a=>(a.date||"").slice(0,4)}],emptyT:"No headcounts yet",emptyM:"Submitted headcounts appear here."});};

function openPerson(id){const x={...(S.newcomers.find(r=>r._id===id)||{})};const ed=canE("followup");const def=SC.newcomers;const log=(x.log||[]).slice().sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  const tpl=S.lettertpls.find(t=>t.kind==="Follow-up"&&(x.kind==="New convert"?/convert/i.test(t.name):/welcome|first/i.test(t.name)))||S.lettertpls.find(t=>t.kind==="Follow-up");
  const msg=tpl?merge(tpl.body,{name:(x.name||"").split(" ")[0]}):`Hello ${x.name}, thank you for worshipping with us at ${settings.churchName} (${settings.churchSub}). We are glad you came. God bless you!`;
  sheet({title:x.name||"Person",body:`<div class="chips">${epill(x.stage||"New")}${pill(x.kind||"First-timer","p-brand")}${nfDue(x)!==null?pill(`No contact for ${nfDue(x)} days`,"p-warn"):""}${x.phone?`<a class="btn sm" href="${waLink(x.phone,msg)}" target="_blank" rel="noopener">${ic("wa")}Send WhatsApp message</a>`:""}</div>
   ${ed?`<fieldset><legend>Log a contact</legend><label class="f">How<select class="in" id="lgCh">${L.Channel.map(c=>`<option>${c}</option>`).join("")}</select></label><label class="f">Move to stage<select class="in" id="lgSt"><option value="">(no change)</option>${L.FollowStage.map(s=>`<option>${s}</option>`).join("")}</select></label><label class="f">Next contact<input class="in" type="date" id="lgNext"></label><label class="f wide">What happened<textarea class="in" id="lgNote" placeholder="e.g. Called – will attend Sunday; prayed with her for her exams"></textarea></label><div class="wide" style="display:flex;justify-content:flex-end"><button class="btn pri" id="lgAdd">Add to timeline</button></div></fieldset>`:""}
   <div class="card"><div class="hd"><h2>Timeline</h2><span class="n">${log.length} contact${log.length===1?"":"s"}</span></div><div class="bd">${log.length?`<div class="tl">${log.map(e=>`<div class="e"><b>${fmtS(e.d)}</b> · ${esc(e.ch||"")}${e.st?` · moved to ${esc(e.st)}`:""}<div class="small">${esc(e.note||"")}</div><div class="small muted">${esc(e.by||"")}</div></div>`).join("")}</div>`:`<div class="muted small">No contacts logged yet.</div>`}</div></div>
   ${def.groups.map(([g,fs])=>`<fieldset><legend>${g}</legend>${fs.map(f=>fieldHTML(f,x,!ed)).join("")}</fieldset>`).join("")}`,
   foot:`${ed?`<button class="btn danger" id="pdel">${ic("trash")}Delete</button>`:""}<span style="flex:1"></span><button class="btn ghost" data-close="1">${ed?"Cancel":"Close"}</button>${ed?`<button class="btn pri" id="psave">Save details</button>`:""}`});
  if(!ed)return;
  document.getElementById("lgAdd").onclick=async()=>{const note=document.getElementById("lgNote").value.trim(),st=document.getElementById("lgSt").value;if(!note&&!st){toast("Write what happened first");return;}
   const d={...x};delete d._id;d.log=[...(x.log||[]),{d:tISO(),ch:document.getElementById("lgCh").value,note,st,by:me.name||""}];d.last=tISO();if(st)d.stage=st;const nx=document.getElementById("lgNext").value;if(nx)d.nextDate=nx;if(!d.stage)d.stage="Contacted";
   if(await save("newcomers",id,d))openPerson(id);};
  document.getElementById("psave").onclick=async()=>{const d=readForm(def.groups,x);delete d._id;if(await save("newcomers",id,d))closeLayer();};
  const pdl=document.getElementById("pdel");let armed=false;pdl.onclick=async()=>{if(!armed){armed=true;pdl.textContent="Tap again to delete";return;}if(await del("newcomers",id))closeLayer();};}

function lineup(p){if(!p||!p.theme||/^(tbd|n\/a)$/i.test(p.theme))return "";const d0=pd(p.date);if(!d0)return "";const set=sortP(S.programs.filter(x=>x.theme===p.theme&&pd(x.date)&&Math.abs(dd(pd(x.date),d0))<=10));if(set.length<2)return "";
  return set.map((x,i)=>`DAY ${i+1}: ${x.prog.replace(/^.*?[–-]\s*/,"").toUpperCase()}\nDATE: ${fmtLong(x.date).toUpperCase()}\nTIME: ${x.time?t12(x.time).toUpperCase()+" PROMPT":"TO BE ANNOUNCED"}`).join("\n\n");}
function mergeData(pid,cid,extra={}){const p=progBy(pid)||{},c=S.contacts.find(x=>x._id===cid)||{};
  return {recipient:c.salute||(c.org?"The Pastor, "+c.org:""),org:c.org||"",address:c.address||"",contact:c.person||"",program:p.prog||"",theme:p.theme&&!/^(tbd|n\/a)$/i.test(p.theme)?p.theme:"",bible:p.bible&&!/^(tbd|n\/a)$/i.test(p.bible)?p.bible:"",date:p.date?fmtLong(p.date):"",time:p.time?t12(p.time):"",venue:p.venue||`${settings.churchName} (${settings.churchSub}) Auditorium, ${settings.address}`,
   lineup:lineup(p),church:settings.churchName,churchSub:settings.churchSub,region:settings.region,churchAddress:settings.address,coordPhone:settings.coordPhone,sender1:settings.sig1Name,title1:settings.sig1Title,sender2:settings.sig2Name,title2:settings.sig2Title,today:fmtLong(tISO()),name:"",...extra};}
const merge=(t,d)=>{const base=mergeData("","");return String(t||"").replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>{const v=(d&&k in d)?d[k]:base[k];return v==null||v===""?(k in base||(d&&k in d)?"":m):v;}).replace(/ with the theme “”\s*(\(\))?/g,"").replace(/ \(\)/g,"").replace(/“”/g,"").replace(/\n{3,}/g,"\n\n");};
const MERGE_HELP="{{recipient}} {{org}} {{address}} {{contact}} {{program}} {{theme}} {{bible}} {{date}} {{time}} {{venue}} {{lineup}} {{church}} {{churchSub}} {{region}} {{coordPhone}} {{sender1}} {{title1}} {{sender2}} {{title2}} {{today}} {{name}}";

async function loadImg(file){const url=URL.createObjectURL(file);try{return await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});}finally{setTimeout(()=>URL.revokeObjectURL(url),2000);}}
async function compressImg(file,size=160){const img=await loadImg(file);const s=Math.min(img.width,img.height);const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);return c.toDataURL("image/jpeg",.82);}
async function shrinkImg(file,max=1100){const img=await loadImg(file);let m=max,q=.76,url="";for(let i=0;i<5;i++){const k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);url=c.toDataURL("image/jpeg",q);if(url.length<620000)return url;q=Math.max(.5,q-.08);m*=.82;}return url;}
function pickImage(cb,max=1100){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=async()=>{const f=i.files[0];if(!f)return;try{toast("Preparing picture…");cb(await shrinkImg(f,max));}catch(e){toast("That picture couldn't be read – try another");}};i.click();}

   <div class="r">${x.status!=="Pending"?`${epill(x.status==="Approved"?"Approved":"Declined")}<span class="small muted">${esc(who(x.checkerId))}</span>`:mine?`<span class="pill p-off">Sent by you</span><button class="btn sm ghost" data-apcancel="${esc(x.queue)}|${esc(x._id)}">Withdraw</button>`:`<button class="btn sm ghost" data-apdecide="${esc(x.queue)}|${esc(x._id)}|Declined">Decline</button><button class="btn sm pri" data-apdecide="${esc(x.queue)}|${esc(x._id)}|Approved">Approve</button>`}</div></div>`;}).join("")||`<div class="empty"><b>${tab==="p"?"Nothing waiting":"Nothing decided yet"}</b>${tab==="p"?"Requests sent to your groups for approval appear here.":""}</div>`}</div></div>`;};

H8.apdecide=async t=>{const[q,id,st]=t.dataset.apdecide.split("|");const x=(QUEUES[q]||[]).find(i=>i._id===id);if(!x)return;if(x.makerId===me.id){toast("You can't approve your own request");return;}
  let note="";if(st==="Declined"){note=prompt("Reason for declining (optional):")||"";}
  if(st==="Approved"){const p=x.payload||{};
    if(x.type==="notices"){if(!await save("notices",rid(),{title:p.title||x.title,body:p.body||"",audience:p.audience||"Everyone",pinned:!!p.pinned,expires:p.expires||"",at:nowISO(),byId:x.makerId,approvedBy:me.id}))return;}
    if(x.type==="letters"){const l=S.letters.find(z=>z._id===p.lid);if(l){const d={...l,status:"Approved",approvedBy:me.id};delete d._id;if(!await save("letters",l._id,d,{quiet:true}))return;}}}
  const d={...x,status:st,checkerId:me.id,checkedAt:nowISO(),note};delete d._id;delete d.queue;
  if(await setDoc(`queues/${q}/items/${id}`,d)){if(st==="Declined"&&x.type==="letters"){const l=S.letters.find(z=>z._id===(x.payload||{}).lid);if(l){const d2={...l,status:"Draft"};delete d2._id;save("letters",l._id,d2,{quiet:true,log:false});}}
    notify([x.makerId],`${st}: ${x.title}`,note||`${who(me.id)} ${st.toLowerCase()} your request.`,x.type==="letters"?"letters":"notices");logAct(st.toLowerCase(),x.type,id,x.title);toast(st);}};

const GTABS=[["chat","Chat"],["notices","Notices"],["tasks","Tasks"],["calendar","Calendar"],["roster","Roster"],["attend","Attendance"],["members","Members"],["requests","Requests"],["dues","Dues"],["finance","Finance"],["inventory","Inventory"],["log","Log"]];const GT_BODIES={};
function groupSpace(g){const t=groupById(g);const lead=isLeadOf(g),ovs=isOverseer(g);
  const tabs=GTABS.filter(([k])=>k!=="finance"||isOfficer(g)||ovs||can("finance")||isAdminUser());let tab=LS.get("gtab","chat");if(!tabs.some(x=>x[0]===tab))tab="chat";
  const crew=gcol(g,"crew");const pend=crew.filter(c=>c.status==="pending").length,step2=crew.filter(c=>c.status==="lead-ok").length;
  if(["chat","log","calendar","finance","inventory"].includes(tab))gsub(g,{chat:"chat",log:"log",calendar:"events",finance:"finance",inventory:"inventory"}[tab]);
  if(tab==="calendar"){gsub(g,"roster");}
  if(tab==="notices"){const s=LS.get("gseen:"+g,{});s.notices=nowISO();LS.set("gseen:"+g,s);}
  const badge={notices:groupUnread(g),members:(lead?pend:0)+(isFinalApprover(g)?step2:0),requests:groupReqCount(g)};
  const units=unitsOf(g);
  const role=lead?((t.leads||[]).includes(me.id)?(t.leadUid===me.id?"You lead this group":"You assist the lead of this group"):"You lead the parent group"):ovs?"You oversee this group":isAdminUser()&&!myGroups().includes(g)?"Admin view":"";
  const banner=ovs&&!lead?`<div class="note-ovs">${ic("eye")}<div><b>Overseer view.</b> You can read everything here, give the final approval for new members and requests, and post notices to guide the group. Day-to-day running (rosters, roles, finance entries) stays with the lead, so decisions keep two pairs of eyes.</div></div>`:"";
  const bodies={...GT_BODIES,chat:gtChat,notices:gtNotices,calendar:gtCalendar,roster:gtRoster,members:gtMembers,requests:gtRequests,finance:gtFinance,inventory:gtInventory,log:gtLog};
  return PH(esc(t.name),"team",`${t.parent?`Unit of ${esc(groupName(t.parent))} · `:""}${esc(t.role||"")}${role?" · "+role:""}`,`${t.parent?btn(esc(groupName(t.parent)),`data-gopen="${esc(t.parent)}"`,"ghost"):""}${btn("All my groups",'data-page="mygroups"',"ghost")}`)+
   `${units.length?`<div class="chips" style="margin:-6px 0 12px"><span class="small muted" style="align-self:center">Units:</span>${units.map(u=>`<button class="chip" data-gopen="${esc(u._id)}">${esc(u.name)}</button>`).join("")}</div>`:""}${banner}
   <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-gtab="${k}">${l}${badge[k]?` <b>${badge[k]}</b>`:""}</button>`).join("")}</div>${bodies[tab](g)}`;}
function msgHTML(m,canDel,delAttr){return `<div class="msg ${m.by===me.id?"me":""}">${m.by===me.id?"":avatar(m.by,28)}<div class="bub"><div class="who">${esc(who(m.by))}${m.role?` · ${esc(m.role)}`:""} · ${ago(m.at)}${canDel?` <button class="lnk" ${delAttr} aria-label="Delete message">×</button>`:""}</div>${imgHTML(m.img)}${m.text?`<div class="tx">${esc(m.text)}</div>`:""}</div></div>`;}
function gtChat(g){const t=groupById(g);const lead=isLeadOf(g);const M=gcol(g,"chat").slice().sort((a,b)=>(a.at||"").localeCompare(b.at||"")).slice(-200);const canPost=inGroup(g)||isOverseer(g);
  return `<div class="card"><div class="chat" id="chatBox">${M.map(m=>msgHTML(m,m.by===me.id||lead,`data-chatdel="${esc(g)}|${esc(m._id)}"`)).join("")||`<div class="empty"><b>No messages yet</b>Say hello – only ${esc(t.name)} members${(t.overseers||[]).length?" and its overseers":""} can read this.</div>`}</div>
   ${canPost?`<div id="stg_chat">${stagedHTML("chat")}</div><form class="chatin" id="chatForm">${attachBtn("chat")}<input class="in" id="chatTx" placeholder="Message ${esc(t.name)}…" autocomplete="off" maxlength="2000"><button class="btn pri" type="submit">Send</button></form>`:""}</div>`;}
AFTER.mygroups=()=>{const cb=document.getElementById("chatBox");if(cb)cb.scrollTop=cb.scrollHeight;const f=document.getElementById("chatForm");if(f)f.onsubmit=async e=>{e.preventDefault();const i=document.getElementById("chatTx");const tx=i.value.trim();const img=STAGED.chat||"";if(!tx&&!img)return;i.value="";delete STAGED.chat;const g=route.param;

function gtNotices(g){const t=groupById(g);const lead=isLeadOf(g);const N=gcol(g,"notices").slice().sort((a,b)=>(b.at||"").localeCompare(a.at||""));gsub(g,"notices");
  return `${lead||isOverseer(g)||canE("notices")?`<div style="margin-bottom:12px">${btn(`${ic("plus")}Post a notice`,`data-gnotice="${esc(g)}"`,"pri")}</div>`:""}<div class="stack">${N.map(x=>`<div class="card"><div class="hd"><h2>${esc(x.title||"Notice")}</h2><span class="n">${x.fromG&&x.fromG!==g?"from "+esc(groupName(x.fromG))+" · ":""}${x.role?esc(x.role)+" · ":""}${ago(x.at)}</span></div><div class="bd">${imgHTML(x.img,"postimg")}<div style="white-space:pre-wrap">${esc(x.body||"")}</div><div class="small muted" style="margin-top:8px">${esc(who(x.by))}${(x.by===me.id||lead)?` · <button class="lnk" data-gndel="${esc(g)}|${esc(x._id)}">Delete</button>`:""}</div></div></div>`).join("")||`<div class="card"><div class="empty"><b>No notices yet</b>Leads and overseers post notices here; notices from other groups addressed to ${esc(t.name)} also arrive here.</div></div>`}</div>`;}
function gtRoster(g){const ed=canRoster(g);gsub(g,"roster");const R=gcol(g,"roster").map(r=>({...r,gid:g}));
  return `${ed?`<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">${btn(`${ic("plus")}Assign someone`,`data-groster="${esc(g)}"`,"pri")}${btn(`${ic("wa")}Reminders`,'data-remind="roster"',"ghost")}</div>`:""}`+rosterLT("gr_"+g,R,ed,g);}
function gtMembers(g){const t=groupById(g);const lead=isLeadOf(g);const fin=isFinalApprover(g);const mem=groupMembers(g);const crewArr=gcol(g,"crew");const crew=Object.fromEntries(crewArr.map(c=>[c._id,c]));
  const pend=crewArr.filter(c=>c.status==="pending"),step2=crewArr.filter(c=>c.status==="lead-ok");const closed=isClosed(t);
  const reqRow=(c,acts)=>`<div class="ri" style="cursor:default"><div>${avatar(c._id,34)}</div><div style="min-width:0"><div class="t">${esc(who(c._id))}</div><div class="m">${c.status==="lead-ok"?`Accepted by ${esc(who(c.leadBy))} · waiting for final approval`:`Asked ${ago(c.at)}`}${S.members.some(m=>m._id===c._id)?"":" · sign-in not yet approved"}</div></div><div class="r">${acts}</div></div>`;
  let top="";
  if(pend.length&&(lead||fin))top+=`<div class="card" style="margin-bottom:14px;border-color:var(--brand)"><div class="hd"><h2>Step 1 · asking to join</h2><span class="n">the lead or assistant accepts first</span></div><div class="rows">${pend.map(c=>reqRow(c,lead&&c._id!==me.id?`<button class="btn sm ghost" data-gjoin="${esc(g)}|${esc(c._id)}|no">Decline</button><button class="btn sm pri" data-gjoin="${esc(g)}|${esc(c._id)}|yes">Accept</button>`:`<span class="small muted">Waiting for the lead</span>`)).join("")}</div></div>`;
  if(step2.length&&(lead||fin))top+=`<div class="card" style="margin-bottom:14px;border-color:var(--warn)"><div class="hd"><h2>Step 2 · final approval</h2><span class="n">${(t.overseers||[]).length?"overseer or admin":"Pastorate or admin"}</span></div><div class="rows">${step2.map(c=>reqRow(c,fin&&c.leadBy!==me.id&&c._id!==me.id?`<button class="btn sm ghost" data-gfinal="${esc(g)}|${esc(c._id)}|no">Decline</button><button class="btn sm pri" data-gfinal="${esc(g)}|${esc(c._id)}|yes">Approve</button>`:`<span class="small muted">${c.leadBy===me.id?"Someone else gives the final approval":"Waiting"}</span>`)).join("")}</div></div>`;

function openSupport(uid){const self=uid===me.id;const path=`support/${uid}/msgs`;sub("sup:"+uid,db.collection(path),snap=>{G[path]=rows(snap);drawSupport(uid);});delete STAGED.sup;
  sheet({title:self?"Help & enquiries":`Enquiry from ${who(uid)}`,body:`<div class="small muted" style="margin:0">${self?"Ask a question, report a problem or send an enquiry. The church admin team replies here and you'll get an alert.":esc(prof(uid).email||"")}</div><div class="chat" id="supBox" style="min-height:240px"></div><div id="stg_sup"></div>`,
   foot:self||canE("support")?`<form class="chatin" id="supForm" style="flex:1;border:0;padding:0">${attachBtn("sup")}<input class="in" id="supTx" placeholder="Type your message…" autocomplete="off" maxlength="2000"><button class="btn pri" type="submit">Send</button></form>`:`<span class="small muted">You can read enquiries. Replying needs Edit on “Answer support enquiries”.</span><span style="flex:1"></span><button class="btn ghost" data-close="1">Close</button>`});

    if(!await addDoc(path,{text:tx,img,by:me.id,at:nowISO()}))return;const th={...((self?G.supme:S.support.find(x=>x._id===uid))||{})};delete th._id;const last=tx.slice(0,140)||"📷 Picture";
    await setDoc(`support/${uid}`,{...th,name:self?who(me.id):(th.name||who(uid)),email:self?(me.email||""):(th.email||""),last,at:nowISO(),unreadAdmin:self,unreadUser:!self});
    if(self)notify(supportTeam().filter(x=>x!==me.id),`Enquiry from ${who(me.id)}`,last,"supportinbox");else notify([uid],"Reply from the church admin",last,"");};
  if(self&&G.supme&&G.supme.unreadUser){setDoc(`support/${uid}`,{...G.supme,unreadUser:false});}

   <div class="grid g2"><label class="f">Closes on (optional)<input class="in" type="date" id="fmC" value="${esc(f.closes||"")}"></label><label class="chk" style="align-self:end"><input type="checkbox" id="fmX" ${f.closed?"checked":""}> Closed – stop accepting answers</label></div>
   <div class="f">Who should fill it${multiHTML("fmA",groups,f.aud||["Everyone"])}</div>
   ${f.qs.map((q,i)=>`<fieldset><legend>Question ${i+1}</legend><label class="f wide">Question<input class="in" data-fq="${i}|q" value="${esc(q.q)}"></label><label class="f">Answer type<select class="in" data-fq="${i}|t">${QTYPES.map(([k,l])=>`<option value="${k}" ${q.t===k?"selected":""}>${l}</option>`).join("")}</select></label><label class="chk"><input type="checkbox" data-fq="${i}|req" ${q.req?"checked":""}> Required</label>${["one","many"].includes(q.t)?`<label class="f wide">Options (one per line)<textarea class="in" data-fq="${i}|o">${esc(q.o||"")}</textarea></label>`:""}<div class="wide" style="display:flex;justify-content:flex-end"><button class="btn ghost sm" data-fqdel="${i}">${ic("trash")}Remove question</button></div></fieldset>`).join("")}
   <button class="btn ghost" data-fqadd="1">${ic("plus")}Add a question</button>`,
   foot:`${f._id?`<button class="btn danger" id="fmDel">${ic("trash")}Delete form</button>`:""}<span style="flex:1"></span><button class="btn ghost" data-close="1">Cancel</button><button class="btn pri" id="fmSave">${f._id?"Save":"Publish form"}</button>`});
  const keep=()=>{f.title=document.getElementById("fmT").value;f.desc=document.getElementById("fmD").value;f.closes=document.getElementById("fmC").value;f.closed=document.getElementById("fmX").checked;f.aud=readMulti("fmA");document.querySelectorAll("[data-fq]").forEach(el=>{const[i,k]=el.dataset.fq.split("|");f.qs[+i][k]=el.type==="checkbox"?el.checked:el.value;});};
  document.querySelectorAll("[data-fq]").forEach(el=>{if(el.tagName==="SELECT")el.onchange=()=>{keep();drawFormEditor();};});
  document.querySelector("[data-fqadd]").onclick=()=>{keep();f.qs.push({q:"",t:"short",o:"",req:false});drawFormEditor();};
  document.querySelectorAll("[data-fqdel]").forEach(b=>b.onclick=()=>{keep();f.qs.splice(+b.dataset.fqdel,1);drawFormEditor();});
  document.getElementById("fmSave").onclick=async()=>{keep();if(!f.title.trim()){toast("Give the form a title");return;}f.qs=f.qs.filter(q=>q.q.trim());if(!f.qs.length){toast("Add at least one question");return;}const id=f._id||rid();const d={...f,title:f.title.trim(),aud:f.aud.length?f.aud:["Everyone"],by:f.by||me.id,at:f.at||nowISO()};delete d._id;
    if(await save("forms",id,d)){closeLayer();if(!f._id){const ids=d.aud.includes("Everyone")?S.members.map(m=>m._id):[...new Set(d.aud.flatMap(groupMembers))];notify(ids,`New form: ${d.title}`,d.desc.slice(0,160),"forms");}formDraft=null;}};
  const fd=document.getElementById("fmDel");if(fd)fd.onclick=async()=>{if(!confirmArm("fm")){fd.textContent="Tap again to delete";return;}if(await del("forms",f._id))closeLayer();};}
H8.formfill=async t=>{const f=S.forms.find(x=>x._id===t.dataset.formfill);if(!f)return;let mine={};try{const r=await db.doc(`forms/${f._id}/responses/${me.id}`).get();if(r.exists)mine=r.data().a||{};}catch(e){}
  const q2=(q,i)=>{const v=mine[i];const o=String(q.o||"").split("\n").map(x=>x.trim()).filter(Boolean);
    if(q.t==="long")return `<textarea class="in" data-fa="${i}">${esc(v||"")}</textarea>`;
    if(q.t==="one")return `<select class="in" data-fa="${i}"><option value=""></option>${o.map(x=>`<option ${v===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`;
    if(q.t==="many")return multiHTML("fa"+i,o.map(x=>[x,x]),Array.isArray(v)?v:[]);
    if(q.t==="rating")return `<div class="seg" data-fseg="${i}">${[1,2,3,4,5].map(x=>`<button type="button" class="${Number(v)===x?"on":""}" data-frate="${i}|${x}">${x}</button>`).join("")}</div><input type="hidden" data-fa="${i}" value="${esc(v||"")}">`;
    if(q.t==="yesno")return `<select class="in" data-fa="${i}"><option value=""></option>${["Yes","No"].map(x=>`<option ${v===x?"selected":""}>${x}</option>`).join("")}</select>`;
    return `<input class="in" data-fa="${i}" type="${q.t==="date"?"date":"text"}" value="${esc(v||"")}">`;};
  sheet({title:f.title,body:`${f.desc?`<div class="small" style="white-space:pre-wrap">${esc(f.desc)}</div>`:""}${(f.qs||[]).map((q,i)=>`<div class="f">${esc(q.q)}${q.req?" *":""}${q2(q,i)}</div>`).join("")}`,foot:`<span style="flex:1"></span><button class="btn ghost" data-close="1">Cancel</button><button class="btn pri" id="faGo">Submit</button>`});
  document.querySelectorAll("[data-frate]").forEach(b=>b.onclick=()=>{const[i,x]=b.dataset.frate.split("|");document.querySelector(`[data-fa="${i}"]`).value=x;b.parentNode.querySelectorAll("button").forEach(z=>z.classList.toggle("on",z===b));});
  document.getElementById("faGo").onclick=async()=>{const a={};for(const[i,q]of (f.qs||[]).entries()){const v=q.t==="many"?readMulti("fa"+i):(document.querySelector(`[data-fa="${i}"]`)||{}).value||"";if(q.req&&(!v||(Array.isArray(v)&&!v.length))){toast(`Please answer: ${q.q}`);return;}a[i]=v;}
    if(await setDoc(`forms/${f._id}/responses/${me.id}`,{a,by:me.id,name:who(me.id),at:nowISO()})){const d=LS.get("fdone",{});d[f._id]=1;LS.set("fdone",d);toast("Thank you – your answers were sent");closeLayer();render();}};};
function formResults(id){const f=(S.forms||[]).find(x=>x._id===id);if(!f)return `<div class="empty">Form not found.</div>`;const path=`forms/${id}/responses`;sub("fr:"+id,db.collection(path),snap=>{G[path]=rows(snap);rerender();});const R=G[path]||[];
  const sumQ=(q,i)=>{const vals=R.map(r=>(r.a||{})[i]).filter(v=>v!==undefined&&v!==""&&!(Array.isArray(v)&&!v.length));
    if(["one","many","yesno","rating"].includes(q.t)){const c={};vals.flat().forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(1,...Object.values(c));return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round(v/mx*100)}%"></i><b>${v}</b></div>`).join("")||`<span class="muted small">No answers yet</span>`;}

  return PH(esc(f.title),"clip",`${R.length} response${R.length===1?"":"s"}`,`${btn("All forms",'data-page="forms"',"ghost")}${dl?btn(`${ic("dl")}Download answers`,`data-fcsv="${esc(id)}"`,"pri"):""}`)+
   `<div class="grid g2">${(f.qs||[]).map((q,i)=>`<div class="card"><div class="hd"><h2>${esc(q.q)}</h2></div><div class="bd">${sumQ(q,i)}</div></div>`).join("")}</div>`;}
H8.fcsv=t=>{const id=t.dataset.fcsv;const f=S.forms.find(x=>x._id===id);const R=G[`forms/${id}/responses`]||[];const q=v=>`"${String(Array.isArray(v)?v.join("; "):v??"").replace(/"/g,'""')}"`;
