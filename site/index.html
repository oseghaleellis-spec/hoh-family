// ---------- security rules ----------
function rulesText(){const owners=JSON.stringify(((window.HOH_WEB&&window.HOH_WEB.owners)||[me.email||""]).map(x=>String(x).toLowerCase()));
  const top=[["programs","programs"],["actions","actions"],["tasktpls","checklists"],["plans","oos"],["assets","bookings"],["bookings","bookings"],["attendance","attendance"],["newcomers","followup"],["contacts","contacts"],["letters","letters"],["reports","reports"],["evangelism","outreach"],["monthly","growth"],["initiatives","initiatives"],["ideas","planning"],["people","repository"]];
  return `rules_version = '2';
// ${APP} – security rules (v7). Firebase console → Firestore Database → Rules → paste everything → Publish.
// Permissions are read live from the app's settings, so changes made in the app apply without republishing.
service cloud.firestore {
  match /databases/{database}/documents {
    function si() { return request.auth != null; }
    function uid() { return request.auth.uid; }
    function owner() { return si() && request.auth.token.email != null && request.auth.token.email.lower() in ${owners}; }
    function mref() { return /databases/$(database)/documents/members/$(request.auth.uid); }
    function approved() { return owner() || (si() && exists(mref())); }
    function mem() { return get(mref()).data; }
    function ids() { return mem().get('rid', []).concat(mem().get('groups', [])).concat(['member']); }
    function admin() { return owner() || (si() && exists(mref()) && mem().get('rid', []).hasAny(['admin'])); }
    function st() { return get(/databases/$(database)/documents/settings/main).data; }
    function canR(m) { return admin() || (approved() && ids().hasAny(st().perm.r[m])); }
    function canW(m) { return admin() || (approved() && ids().hasAny(st().perm.w[m])); }
    function team(g) { return get(/databases/$(database)/documents/teams/$(g)).data; }
    function inGroup(g) { return admin() || (approved() && mem().get('groups', []).hasAny([g])); }
    function pastor() { return approved() && mem().get('groups', []).hasAny(['pastorate']); }
    function leadOf(g) { return admin() || (si() && team(g).get('leads', []).hasAny([uid()])); }
    function lead(g) { return leadOf(g) || (si() && team(team(g).get('parent', '-')).get('leads', []).hasAny([uid()])); }
    function ovs(g) { return si() && team(g).get('overseers', []).hasAny([uid()]); }
    function see(g) { return inGroup(g) || ovs(g) || lead(g); }
    function officer(g) { return lead(g) || (si() && get(/databases/$(database)/documents/teams/$(g)/crew/$(request.auth.uid)).data.get('sub', '') in ['Treasurer', 'Secretary']); }
    function mine(f) { return si() && request.resource.data[f] == uid(); }
    function was(f) { return si() && resource.data[f] == uid(); }
    function oneGroupChange() {
      return request.resource.data.diff(resource.data).affectedKeys().hasOnly(['groups', 'gchg'])
        && request.resource.data.groups.toSet().difference(resource.data.get('groups', []).toSet())
             .union(resource.data.get('groups', []).toSet().difference(request.resource.data.groups.toSet()))
             .hasOnly([request.resource.data.gchg]);
    }

    match /settings/{id} { allow read: if approved(); allow write: if admin(); }
    match /public/{id} { allow read: if approved() || (si() && id == 'groups'); allow write: if canW('programs') || (id == 'groups' && canW('teams')); }
    match /profiles/{u} { allow read: if approved() || (si() && uid() == u); allow create, update: if (si() && uid() == u) || admin(); allow delete: if admin(); }
    match /members/{u} {
      allow read: if approved() || (si() && uid() == u);
      allow write: if admin();
      // Pastorate or a group's overseer give the final approval (add or remove one group);
      // a group lead may only remove someone from their own group.
      allow update: if approved() && oneGroupChange() && (pastor() || ovs(request.resource.data.gchg)
        || (lead(request.resource.data.gchg) && request.resource.data.groups.size() < resource.data.get('groups', []).size()));
    }
    match /activity/{id} { allow read: if canR('activity'); allow create: if approved() && mine('by'); }
    match /inbox/{u}/items/{id} { allow read, update, delete: if si() && uid() == u; allow create: if approved() && mine('from'); }
    match /queues/{r}/items/{id} {
      allow read: if admin() || (approved() && ids().hasAny([r])) || was('makerId');
      allow create: if approved() && mine('makerId') && request.resource.data.status == 'Pending';
      allow update: if (admin() || (approved() && ids().hasAny([r]))) && resource.data.makerId != uid();
      allow delete: if admin() || was('makerId');
    }
    match /support/{u} {
      allow read, write: if (si() && uid() == u) || canR('support');
      match /msgs/{id} { allow read: if (si() && uid() == u) || canR('support'); allow create: if ((si() && uid() == u) || canW('support')) && mine('by'); allow delete: if admin(); }
    }
    match /teams/{g} {
      allow read: if approved();
      allow write: if canW('teams');
      match /crew/{u} {
        allow read: if see(g) || pastor() || (si() && uid() == u);
        allow create: if (si() && uid() == u && request.resource.data.status == 'pending' && team(g).get('closed', false) == false) || lead(g) || pastor();
        allow update: if lead(g) || pastor() || ovs(g);
        allow delete: if (si() && uid() == u) || lead(g) || pastor() || ovs(g);
      }
      match /chat/{id} { allow read: if see(g); allow create: if (inGroup(g) || ovs(g)) && mine('by'); allow update, delete: if was('by') || lead(g); }
      match /log/{id} { allow read: if see(g); allow create: if inGroup(g) && mine('by'); allow update, delete: if lead(g); }
      match /notices/{id} {
        allow read: if see(g);
        allow create: if mine('by') && (lead(g) || ovs(g) || canW('notices') || leadOf(request.resource.data.get('fromG', '-')) || ovs(request.resource.data.get('fromG', '-')));
        allow update, delete: if was('by') || lead(g);
      }
      match /roster/{id} { allow read: if see(g) || canR('rosters'); allow write: if lead(g) || canW('rosters') || leadOf(st().get('hier', {}).get(g, '-')); }
      match /events/{id} { allow read: if see(g); allow write: if officer(g); }
      match /inventory/{id} { allow read: if see(g); allow write: if officer(g); }
      match /finance/{id} { allow read: if officer(g) || ovs(g) || canR('finance'); allow write: if officer(g); }
      match /dues/{id} { allow read: if see(g) || canR('finance'); allow write: if officer(g); }
      match /duesplan/{id} { allow read: if see(g) || canR('finance'); allow write: if officer(g) || mine('uid') || was('uid'); }
      match /duespay/{id} { allow read: if officer(g) || ovs(g) || canR('finance') || was('uid'); allow write: if officer(g); }
    }
    match /requests/{id} {
      allow read: if canR('requests') || see(resource.data.gid);
      allow create: if mine('by') && inGroup(request.resource.data.gid);
      allow update: if canW('requests') || lead(resource.data.gid) || ovs(resource.data.gid);
      allow delete: if admin() || (was('by') && resource.data.status in ['Requested', 'Endorsed']);
    }
    match /feed/{id} { allow read: if approved(); allow write: if canW('feed'); }
    match /forms/{f} {
      allow read: if approved();
      allow write: if canW('forms');
      match /responses/{u} { allow read: if canR('forms') || (si() && uid() == u); allow create, update: if approved() && uid() == u && mine('by'); allow delete: if canW('forms'); }
    }
    match /rels/{id} {
      allow read: if approved();
      allow create: if approved() && mine('from') && request.resource.data.status == 'Pending' && request.resource.data.to != uid();
      allow update: if si() && resource.data.to == uid() && resource.data.status == 'Pending' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status', 'at2']);
      allow delete: if admin() || was('from') || was('to');
    }
    match /pushTokens/{u} { allow read, write: if si() && uid() == u; }
    match /secq/{u} { allow read, create, update: if si() && uid() == u; allow delete: if admin() || (si() && uid() == u); }
    match /sessions/{id} {
      allow read: if admin() || was('uid');
      allow create: if si() && mine('uid');
      allow update: if admin() || (was('uid') && mine('uid'));
      allow delete: if admin() || was('uid');
    }
    match /tasks/{id} {
      allow read: if admin() || pastor() || inGroup(resource.data.ogid) || see(resource.data.gid) || was('assignee');
      allow create: if approved() && mine('reporter') && (inGroup(request.resource.data.ogid) || lead(request.resource.data.gid));
      allow update: if admin() || inGroup(resource.data.ogid) || inGroup(resource.data.gid) || ovs(resource.data.gid) || was('assignee');
      allow delete: if admin() || inGroup(resource.data.ogid);
    }
    match /minutes/{id} {
      allow read: if admin() || pastor() || inGroup(resource.data.ogid);
      allow create, update: if admin() || inGroup(request.resource.data.ogid);
      allow delete: if admin() || inGroup(resource.data.ogid);
    }
    match /projects/{id} { allow read: if approved(); allow write: if admin() || pastor() || inGroup('project-management-team'); }
    match /workatt/{id} {
      allow read: if approved();
      allow create: if (approved() && mine('uid') && request.resource.data.status in ['Present', 'Pending']) || lead(request.resource.data.gid) || canW('attendance');
      allow update: if lead(resource.data.gid) || canW('attendance');
      allow delete: if lead(resource.data.gid) || canW('attendance') || (was('uid') && resource.data.status == 'Pending');
    }
    match /campaigns/{id} { allow read: if approved(); allow write: if canW('campaigns'); }
    match /books/{id} { allow read: if approved(); allow write: if canW('library'); }
    match /libcfg/{id} { allow read: if approved(); allow write: if canW('library'); }
    match /libcards/{u} {
      allow read: if approved();
      allow create: if (approved() && uid() == u && request.resource.data.status == 'Pending') || canW('library');
      allow update: if canW('library') || (si() && uid() == u && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name', 'address', 'phone']))
        || (si() && uid() == u && resource.data.status == 'Declined' && request.resource.data.status == 'Pending' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status', 'reqAt', 'note']));
      allow delete: if canW('library');
    }
    match /loans/{id} {
      allow read: if canR('library') || was('uid');
      allow create: if (approved() && mine('uid') && request.resource.data.status == 'Requested') || canW('library');
      allow update: if canW('library') || (was('uid') && resource.data.status == 'Requested' && request.resource.data.status == 'Cancelled');
      allow delete: if canW('library');
    }
    match /notices/{id} { allow read: if approved(); allow write: if canW('notices'); }
    match /blackouts/{id} { allow read, write: if approved(); }
    match /lettertpls/{id} { allow read: if approved(); allow write: if canW('letters'); }
    match /proposals/{id} {
      allow read: if canR('proposals') || canR('approve');
      allow create: if canW('proposals');
      allow update, delete: if canW('approve') || was('byId');
    }
${top.map(([c,m])=>`    match /${c}/{id} { allow read: if canR('${m}'); allow write: if canW('${m}'); }`).join("\n")}
  }
}
`;}

async function decideQueue(q,id,st,note=""){const x=(QUEUES[q]||[]).find(i=>i._id===id);if(!x||x.makerId===me.id||x.status!=="Pending")return false;
  if(st==="Approved"){const p=x.payload||{};
    if(x.type==="notices"){if(!await save("notices",rid(),{title:p.title||x.title,body:p.body||"",img:p.img||"",audience:p.audience||"Everyone",pinned:!!p.pinned,expires:p.expires||"",at:nowISO(),byId:x.makerId,approvedBy:me.id},{quiet:true}))return false;}
    if(x.type==="letters"){const l=S.letters.find(z=>z._id===p.lid);if(l){const d={...l,status:"Approved",approvedBy:me.id};delete d._id;if(!await save("letters",l._id,d,{quiet:true}))return false;}}}
  const d={...x,status:st,checkerId:me.id,checkedAt:nowISO(),note};delete d._id;delete d.queue;
  if(!await setDoc(`queues/${q}/items/${id}`,d))return false;
  if(st==="Declined"&&x.type==="letters"){const l=S.letters.find(z=>z._id===(x.payload||{}).lid);if(l){const d2={...l,status:"Draft"};delete d2._id;save("letters",l._id,d2,{quiet:true,log:false});}}
  notify([x.makerId],`${st}: ${x.title}`,note||`${who(me.id)} ${st.toLowerCase()} your request.`,x.type==="letters"?"letters":"notices");logAct(st.toLowerCase(),x.type,id,x.title);return true;}
async function finalDecide(g,u,yes,note=""){const c=gcol(g,"crew").find(x=>x._id===u)||{};if(c.leadBy===me.id||u===me.id||c.status!=="lead-ok")return false;
  if(yes){if(!await setGroupsOf(u,g,true))return false;const d={...c,status:"member",sub:c.sub||"Member",finalBy:me.id,finalAt:nowISO()};delete d._id;await setDoc(`teams/${g}/crew/${u}`,d);notify([u],`Welcome to ${groupName(g)}`,"Your membership has been approved.","mygroups:"+g);if(c.leadBy)notify([c.leadBy],`${who(u)} is now in ${groupName(g)}`,"Final approval given.","mygroups:"+g);logAct("approved member",`teams/${g}`,u,who(u));}
  else{await delDoc(`teams/${g}/crew/${u}`);notify([u,c.leadBy].filter(Boolean),`${groupName(g)}: request not approved`,note||`${who(u)}'s membership wasn't approved at the final step.`,"profile");}
  return true;}
async function reqDecide(id,s,note="",spent=""){const r=allReqs().find(x=>x._id===id);if(!r)return false;const d={...r,status:s,hist:[...(r.hist||[]),{s,by:me.id,at:nowISO(),note}]};
  if(s==="Endorsed")d.endBy=me.id;if(s==="Approved")d.apprBy=me.id;if(s==="Supplied"&&spent)d.spent=Number(spent);delete d._id;
  if(!await save("requests",id,d,{quiet:true}))return false;const t2=groupById(r.gid)||{};const to=s==="Endorsed"?[...(t2.overseers||[]),...usersWithRole("admin")]:[r.by,...(t2.leads||[])];
  notify(to,`${s}: ${r.item}`,`${groupName(r.gid)} · ${who(me.id)}${note?" – "+note:""}`,s==="Endorsed"?"approvals":"mygroups:"+r.gid);return true;}

const visEl=s=>{for(const q of s){const el=document.querySelector(q);if(!el)continue;const r=el.getBoundingClientRect();if(r.width>0&&r.height>0)return el;}return null;};
function openTour(i){i=Math.max(0,Math.min(TOUR.length-1,Number(i)||0));if(document.body.classList.contains("onb-mode")){setTimeout(()=>openTour(i),1500);return;}const st=TOUR[i];
  if(st.page&&route.page!==st.page){goPage(st.page);setTimeout(()=>openTour(i),350);return;}
  let el=visEl(st.sel);if(!el&&i<TOUR.length-1)return openTour(i+1);
  document.querySelectorAll(".tourfx").forEach(x=>x.remove());if(el)el.scrollIntoView({block:"center",behavior:"instant"});
  const fx=document.createElement("div");fx.className="tourfx";document.body.appendChild(fx);
  const draw=()=>{const W=innerWidth,Hh=innerHeight;const r=el?el.getBoundingClientRect():{left:W/2,top:Hh/2,width:0,height:0,right:W/2,bottom:Hh/2};const pad=8;const x1=Math.max(4,r.left-pad),y1=Math.max(4,r.top-pad),x2=Math.min(W-4,r.right+pad),y2=Math.min(Hh-4,r.bottom+pad);

    const cw=Math.min(340,W-24);let cx=Math.min(Math.max(12,(x1+x2)/2-cw/2),W-cw-12);let below=y2+12+190<Hh;let cy=below?y2+14:Math.max(12,y1-14-190);
    fx.innerHTML=`<div class="tf-blur" style="clip-path:${hole}"></div><div class="tf-ring" style="left:${x1}px;top:${y1}px;width:${x2-x1}px;height:${y2-y1}px"></div>
     <div class="tf-card" role="dialog" aria-label="App tour" style="left:${cx}px;top:${cy}px;width:${cw}px"><div class="tf-step">Step ${i+1} of ${TOUR.length}</div><h3>${esc(st.t)}</h3><p>${esc(st.b)}</p><div class="tour-dots">${TOUR.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div>

const FREQS=["Weekly","Monthly","Quarterly","Annually","One-off"];const PER_YEAR={Weekly:52,Monthly:12,Quarterly:4,Annually:1,"One-off":0};
function periodsSince(start,freq,to=today()){const s=pd(start);if(!s||s>to)return 0;if(freq==="One-off")return 1;
  if(freq==="Weekly")return Math.floor(dd(to,s)/7)+1;const m=(to.getFullYear()-s.getFullYear())*12+(to.getMonth()-s.getMonth())+(to.getDate()>=s.getDate()?0:-1);
  if(freq==="Monthly")return Math.max(0,m)+1;if(freq==="Quarterly")return Math.floor(Math.max(0,m)/3)+1;if(freq==="Annually")return Math.floor(Math.max(0,m)/12)+1;return 0;}
function perPeriod(sc,plan){if(plan&&plan.amount!==""&&plan.amount!=null)return n(plan.amount);const f=(plan&&plan.freq)||sc.freq;if(sc.freq==="One-off"||f==="One-off"||f===sc.freq)return n(sc.amount);return Math.round(n(sc.amount)*PER_YEAR[sc.freq]/PER_YEAR[f]);}
function duesRow(g,sc,u){const plan=gcol(g,"duesplan").find(p=>p.sid===sc._id&&p.uid===u)||null;const freq=(plan&&plan.freq)||sc.freq;const amt=perPeriod(sc,plan);const start=(plan&&plan.start)||sc.start;
  let periods=periodsSince(start,freq);if(sc.end&&sc.end<tISO())periods=Math.min(periods,periodsSince(start,freq,pd(sc.end)));const expected=periods*amt;
  const pays=duesPays(g).filter(p=>p.sid===sc._id&&p.uid===u);const paid=pays.reduce((s,p)=>s+n(p.amount),0);return{u,plan,freq,amt,start,periods,expected,paid,bal:expected-paid,pays};}
function duesPays(g){const path=`teams/${g}/duespay`;if(isOfficer(g)||isOverseer(g)||can("finance"))gsub(g,"duespay");else{const c=db.collection(path);sub(`dp:${g}`,c.where?c.where("uid","==",me.id):c,snap=>{G[path]=rows(snap).filter(x=>x.uid===me.id);rerender();});}return G[path]||[];}
const duesState=b=>b<=0?(b<0?pill("Ahead by "+naira(-b),"p-ok"):pill("Up to date","p-ok")):pill("Owing "+naira(b),"p-crit");
GT_BODIES.dues=g=>{gsub(g,"dues");gsub(g,"duesplan");const off=isOfficer(g);const SC2=gcol(g,"dues").filter(s=>s.active!==false).sort((a,b)=>(a.kind||"").localeCompare(b.kind||"")||(a.name||"").localeCompare(b.name||""));
  let cur=LS.get("dues:"+g,"");if(!SC2.some(s=>s._id===cur))cur=(SC2[0]||{})._id||"";const sc=SC2.find(s=>s._id===cur);

  const mem=off||isOverseer(g)||can("finance")?groupMembers(g):[me.id].filter(u=>groupMembers(g).includes(u));const R=mem.map(u=>duesRow(g,sc,u));
  const tExp=R.reduce((s,r)=>s+r.expected,0),tPaid=R.reduce((s,r)=>s+r.paid,0),owing=R.filter(r=>r.bal>0);
  return head+`<div class="card" style="margin-bottom:12px"><div class="bd small">${esc(sc.kind||"Dues")} · ${naira(sc.amount)} ${({Weekly:"per week",Monthly:"per month",Quarterly:"per quarter",Annually:"per year","One-off":"once"})[sc.freq]||""} · from ${fmtS(sc.start)}${sc.end?` to ${fmtS(sc.end)}`:""}${sc.note?` · ${esc(sc.note)}`:""}<br><span class="muted">Members can agree to pay weekly, monthly, quarterly or yearly – the amount per payment adjusts so the total stays the same.</span></div></div>

const DEVID=(()=>{let d=LS.get("devid","");if(!d){d=Date.now().toString(36)+Math.random().toString(36).slice(2,10);LS.set("devid",d);}return d;})();
function devLabel(ua=navigator.userAgent){const b=/Edg\//.test(ua)?"Edge":/SamsungBrowser/.test(ua)?"Samsung Internet":/OPR\//.test(ua)?"Opera":/Firefox\//.test(ua)?"Firefox":/CriOS|Chrome\//.test(ua)?"Chrome":/Safari\//.test(ua)?"Safari":"Browser";
  const o=/iPhone/.test(ua)?"iPhone":/iPad/.test(ua)?"iPad":/Android/.test(ua)?(((ua.match(/Android [\d.]+; ([^;)]+)/)||[])[1]||"Android").replace(/Build.*/,"").trim()):/Windows/.test(ua)?"Windows PC":/Mac OS X/.test(ua)?"Mac":/Linux/.test(ua)?"Linux":"Device";
  const app=matchMedia("(display-mode: standalone)").matches?" (installed app)":"";return `${b} on ${o}${app}`;}

  sub("mysessdoc",db.doc(`sessions/${sessId()}`),s=>{G.mysessdoc=s.exists?s.data():null;if(G.mysessdoc&&G.mysessdoc.revoked){LS.set("trust:"+me.id,"");toast("This device was signed out from another device");setTimeout(()=>window.HOH_WEB&&window.HOH_WEB.signOut(),1500);}});
  try{if(window.HOH_WEB&&window.HOH_WEB.recordSession){const ok=await window.HOH_WEB.recordSession({deviceId:DEVID,label});if(ok)return;}}catch(e){}
  try{const r=await db.doc(`sessions/${sessId()}`).get();const old=r.exists?r.data():{};await db.doc(`sessions/${sessId()}`).set({...old,uid:me.id,deviceId:DEVID,label,ua:navigator.userAgent.slice(0,200),first:old.first||nowISO(),last:nowISO(),count:n(old.count)+1,trusted:!!old.trusted,revoked:false});}catch(e){}}

const SECQS=["What was the name of your first school?","In which town or city were you born?","What is your mother's maiden name?","What was the name of your childhood best friend?","In which church did you give your life to Christ?","What street did you live on as a child?","What was the name of your first pet?","What was the make of your first car or motorcycle?","What is the middle name of your eldest sibling?"];
const normAns=a=>String(a||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g," ").trim();
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const secqSub=()=>{if(me.id&&db)sub("secq",db.doc(`secq/${me.id}`),s=>{G.secq=s.exists?s.data():null;G.secqLoaded=true;rerender();});};
const trusted=()=>!!LS.get("trust:"+me.id,"")&&G.secq&&LS.get("trust:"+me.id,"")===G.secq.salt;
function securityGate(){if(!me.id||!db||!window.HOH_WEB)return "";secqSub();recordSession();if(!G.secqLoaded)return `<div class="boot"><div><img src="${LOGO}" alt=""><p class="muted">Checking your account…</p></div></div>`;
  if(!G.secq)return secSetupHTML(false);if(!trusted())return secCheckHTML();return "";}
function qSel(id,val,other){return `<select class="in" id="${id}">${SECQS.filter(q=>q!==other).map(q=>`<option ${q===val?"selected":""}>${esc(q)}</option>`).join("")}</select>`;}
function secSetupHTML(change){return `<div class="onb"><div class="card onb-card"><div class="onb-hd">${ic("lock")}<div><h2>${change?"Change your security questions":"Protect your account"}</h2><p>Choose two security questions. You'll answer them when you sign in on a new phone or computer, and before sensitive changes.</p></div></div><div class="bd stack">
   <div class="grid g2"><label class="f wide">Question 1${qSel("sq1",SECQS[0],"")}</label><label class="f wide">Your answer<input class="in" id="sa1" autocomplete="off"></label><label class="f wide">Question 2${qSel("sq2",SECQS[1],"")}</label><label class="f wide">Your answer<input class="in" id="sa2" autocomplete="off"></label></div>
   <div class="small muted">Answers aren't case-sensitive and are stored scrambled (hashed) – nobody, not even admins, can read them. Pick answers you'll remember but others can't easily guess.</div>
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">${change?`<button class="btn ghost" data-close="1" id="sqCancel">Cancel</button>`:`<button class="btn ghost" data-signout="1">Sign out</button>`}<button class="btn pri" data-secsave="1">Save security questions</button></div></div></div></div>`;}
H8.secsave=async t=>{const q1=document.getElementById("sq1").value,q2=document.getElementById("sq2").value,a1=normAns(document.getElementById("sa1").value),a2=normAns(document.getElementById("sa2").value);
  if(q1===q2){toast("Choose two different questions");return;}if(a1.length<3||a2.length<3){toast("Each answer needs at least 3 letters");return;}if(a1===a2){toast("Use different answers for the two questions");return;}
  t.disabled=true;const salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");const d={q1,q2,salt,h1:await sha(salt+"|"+a1),h2:await sha(salt+"|"+a2),at:nowISO()};
  if(await setDoc(`secq/${me.id}`,d)){G.secq=d;LS.set("trust:"+me.id,salt);LS.set("secfail:"+me.id,0);markTrusted();toast("Security questions saved");logAct("set security questions","secq",me.id,"");if(document.querySelector(".scrim"))closeLayer();render();}else t.disabled=false;};
async function markTrusted(){try{const r=await db.doc(`sessions/${sessId()}`).get();const old=r.exists?r.data():{uid:me.id,deviceId:DEVID,label:devLabel(),first:nowISO()};await db.doc(`sessions/${sessId()}`).set({...old,trusted:true,trustedAt:nowISO(),revoked:false,last:nowISO()});}catch(e){}}
function secCheckHTML(){const q=G.secq;const fails=n(LS.get("secfail:"+me.id,0));const locked=fails>=5;
  return `<div class="onb"><div class="card onb-card"><div class="onb-hd">${ic("lock")}<div><h2>Security check</h2><p>${esc(who(me.id)||me.email)}, this looks like a new device or browser. Answer your security questions to continue.</p></div></div><div class="bd stack">
   ${locked?`<div class="banner">${ic("lock")}<div style="flex:1"><b>Too many wrong answers.</b> For your safety this device is locked. Ask a church admin to reset your security questions, then sign in again.</div></div><div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap"><button class="btn ghost" data-signout="1">Sign out</button><button class="btn pri" data-support="">Message the admin</button></div>`
   :`<label class="f">${esc(q.q1)}<input class="in" id="sc1" autocomplete="off"></label><label class="f">${esc(q.q2)}<input class="in" id="sc2" autocomplete="off"></label>${fails?`<div class="small c-crit">${5-fails} attempt${5-fails===1?"":"s"} left</div>`:""}
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-signout="1">Not you? Sign out</button><button class="btn pri" data-seccheck="1">Continue</button></div><div class="small muted">Forgot your answers? Use the help button or ask a church admin to reset them.</div>`}</div></div></div>`;}
H8.seccheck=async t=>{const q=G.secq;const a1=normAns(document.getElementById("sc1").value),a2=normAns(document.getElementById("sc2").value);t.disabled=true;
  const ok=(await sha(q.salt+"|"+a1))===q.h1&&(await sha(q.salt+"|"+a2))===q.h2;
  if(ok){LS.set("trust:"+me.id,q.salt);LS.set("secfail:"+me.id,0);await markTrusted();logAct("passed security check","sessions",sessId(),devLabel());toast("Thank you – device verified");render();}
  else{const f=n(LS.get("secfail:"+me.id,0))+1;LS.set("secfail:"+me.id,f);logAct("failed security check","sessions",sessId(),devLabel());if(f>=5)notify(usersWithRole("admin"),`Security lock: ${who(me.id)}`,`Five wrong security answers on ${devLabel()}.`,"peopleadmin");toast("That doesn't match");render();}};
function askSecurity(then){const q=G.secq;if(!q)return then();const pick=Math.random()<.5?1:2;sheet({title:"Confirm it's you",body:`<label class="f">${esc(q["q"+pick])}<input class="in" id="asA" autocomplete="off"></label>`,foot:`<span style="flex:1"></span><button class="btn ghost" data-close="1">Cancel</button><button class="btn pri" id="asGo">Confirm</button>`});
  document.getElementById("asGo").onclick=async()=>{const h=await sha(q.salt+"|"+normAns(document.getElementById("asA").value));if(h===q["h"+pick]){closeLayer();setTimeout(then,150);}else toast("That doesn't match");};}

const ALOG=k=>(S.adminlog||[]).filter(x=>x.kind===k).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||"").localeCompare(a.at||""));

const admCfg=()=>({lowUnits:50,lowDiesel:50,...(settings.admCfg||{})});
function power(){const R=ALOG("recharge"),Rd=ALOG("reading"),Ps=ALOG("power");const last=Rd[0];const since=last?R.filter(r=>r.date>last.date):R;const est=last?nn(last.units)+since.reduce((s,r)=>s+nn(r.units),0):null;
  const m=thisMonth();const Rm=R.filter(r=>(r.date||"").startsWith(m));const amtM=Rm.reduce((s,r)=>s+nn(r.amount),0),unM=Rm.reduce((s,r)=>s+nn(r.units),0);const allA=R.reduce((s,r)=>s+nn(r.amount),0),allU=R.reduce((s,r)=>s+nn(r.units),0);
  // usage between consecutive readings: prev + recharges between - current
  const rs=[...Rd].sort((a,b)=>(a.date||"").localeCompare(b.date||""));const use=[];for(let i=1;i<rs.length;i++){const a=rs[i-1],b=rs[i];const add=R.filter(r=>r.date>a.date&&r.date<=b.date).reduce((s,r)=>s+nn(r.units),0);const used=nn(a.units)+add-nn(b.units);const days=Math.max(1,Math.round((new Date(b.date)-new Date(a.date))/864e5));use.push({from:a.date,to:b.date,used,days,perDay:used/days});}
  const avgDay=use.length?use.reduce((s,u)=>s+u.used,0)/use.reduce((s,u)=>s+u.days,0):null;const PM=Ps.filter(p=>(p.date||"").startsWith(m));const cnt=s=>PM.filter(p=>p.source===s).length;
  const low=est!=null&&est<admCfg().lowUnits;
  return `${low?`<div class="card" style="border-color:var(--crit);margin-bottom:12px"><div class="bd"><b class="c-crit">Units may be low</b> – about ${fmtN(est,1)} kWh left since the last reading. Consider recharging.</div></div>`:""}
  <div class="stats" style="margin-bottom:12px">${kpi(est==null?"—":fmtN(est,1)+" kWh","Estimated units left",low?"c-crit":"")}${kpi(naira(amtM),"Recharged this month")}${kpi(fmtN(unM,1)+" kWh","Units bought this month")}${kpi(allU?naira(Math.round(allA/allU)):"—","Average cost per kWh")}${kpi(avgDay==null?"—":fmtN(avgDay,1)+" kWh","Average use per day")}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${admEd()?btn(`${ic("bolt")}Log a recharge`,'data-alog="recharge|"',"pri")+btn(`${ic("count")}Meter reading`,'data-alog="reading|"',"ghost")+btn(`${ic("cal")}Power used at a service`,'data-alog="power|"',"ghost")+btn(`${ic("gear")}Alert levels`,'data-admcfg="1"',"ghost"):""}</div>
  <div class="small muted" style="margin:-4px 0 12px">Meter readings can be occasional. Usage is worked out between any two readings, counting the recharges in between.</div>
  <div class="grid g2" style="align-items:start"><div class="card"><div class="hd"><h2>Recharges</h2></div><div class="rows">${R.slice(0,10).map(r=>`<button class="ri" data-alog="recharge|${esc(r._id)}">${dateBox(r.date)}<div><div class="t">${naira(r.amount)} · ${fmtN(r.units,1)} kWh</div><div class="m">${esc([r.vendor,r.token&&"Token "+r.token,r.payer].filter(Boolean).join(" · "))}</div></div><div class="r"></div></button>`).join("")||`<div class="empty">No recharges logged.</div>`}</div></div>
   <div class="stack"><div class="card"><div class="hd"><h2>Meter readings & usage</h2></div><div class="rows">${Rd.slice(0,8).map(r=>{const u=use.find(x=>x.to===r.date);return `<button class="ri" data-alog="reading|${esc(r._id)}">${dateBox(r.date)}<div><div class="t">${fmtN(r.units,1)} kWh left</div><div class="m">${u?`Used ${fmtN(u.used,1)} kWh over ${u.days} day${u.days===1?"":"s"} (${fmtN(u.perDay,1)}/day)`:"First reading"}</div></div><div class="r"></div></button>`;}).join("")||`<div class="empty">No readings yet.</div>`}</div></div>
   <div class="card"><div class="hd"><h2>Power at services · ${MF[Number(m.slice(5))-1]}</h2><span class="n">Electricity ${cnt("Electricity")} · Generator ${cnt("Generator")} · Both ${cnt("Both")}</span></div><div class="rows">${Ps.slice(0,8).map(p=>`<button class="ri" data-alog="power|${esc(p._id)}">${dateBox(p.date)}<div><div class="t">${esc(p.service||"Service")}</div><div class="m">${esc(p.source)}${p.gen?" · "+esc(genName(p.gen)):""}${p.hours?` · ${p.hours} h`:""}</div></div><div class="r">${pill(p.source,p.source==="Electricity"?"p-ok":p.source==="Generator"?"p-warn":"p-info")}</div></button>`).join("")||`<div class="empty">Nothing logged yet.</div>`}</div></div></div></div>`;}
const gensAll=()=>(S.equipment||[]).filter(e=>e.cat==="Generator");const genName=id=>((S.equipment||[]).find(e=>e._id===id)||{}).name||"Generator";
function gens(){const G2=gensAll();const D=ALOG("diesel"),Run=ALOG("run"),Sv=ALOG("service");const stock=D.reduce((s,x)=>s+nn(x.litres),0)-Run.reduce((s,x)=>s+nn(x.litres),0);const low=stock<admCfg().lowDiesel;
  const m=thisMonth();const dM=D.filter(x=>(x.date||"").startsWith(m));const costM=dM.reduce((s,x)=>s+nn(x.litres)*nn(x.price),0);const hrs=Run.reduce((s,x)=>s+nn(x.hours),0),lit=Run.reduce((s,x)=>s+nn(x.litres),0);
  const gRow=g=>{const R=Run.filter(r=>r.gen===g._id);const h=R.reduce((s,r)=>s+nn(r.hours),0);const lastS=Sv.find(s=>s.gen===g._id);const since=R.filter(r=>!lastS||r.date>lastS.date).reduce((s,r)=>s+nn(r.hours),0);const due=nn(g.svcHours||100);
    return `<button class="ri" data-eqedit="${esc(g._id)}"><div class="rico sm">${ic("bolt")}</div><div style="min-width:0"><div class="t">${esc(g.name)} ${g.status==="Decommissioned"?pill("Decommissioned","p-off"):""}</div><div class="m">${esc([g.capacity,g.location].filter(Boolean).join(" · "))} · ${fmtN(h,1)} h run · last service ${lastS?fmtS(lastS.date):"not logged"}</div></div><div class="r">${g.status!=="Decommissioned"?(since>=due?pill(`Service due (${fmtN(since,0)} h)`,"p-crit"):pill(`${fmtN(Math.max(0,due-since),0)} h to service`,"p-ok")):""}</div></button>`;};
  return `${low?`<div class="card" style="border-color:var(--crit);margin-bottom:12px"><div class="bd"><b class="c-crit">Diesel is low</b> – about ${fmtN(stock,0)} litres left.</div></div>`:""}
  <div class="stats" style="margin-bottom:12px">${kpi(fmtN(stock,0)+" L","Diesel in stock",low?"c-crit":"")}${kpi(naira(Math.round(costM)),"Diesel bought this month")}${kpi(hrs?fmtN(lit/hrs,1)+" L/h":"—","Average use per hour")}${kpi(G2.filter(g=>g.status!=="Decommissioned").length,"Generators in use")}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${admEd()?btn(`${ic("plus")}Add generator`,'data-eqedit="|Generator"',"pri")+btn(`${ic("fuel")}Diesel purchase`,'data-alog="diesel|"',"ghost")+btn(`${ic("clock")}Generator run`,'data-alog="run|"',"ghost")+btn(`${ic("wrench")}Service / repair`,'data-alog="service|"',"ghost"):""}</div>
  <div class="grid g2" style="align-items:start"><div class="card"><div class="hd"><h2>Generators</h2></div><div class="rows">${G2.map(gRow).join("")||`<div class="empty">Add your generators to start tracking.</div>`}</div></div>
   <div class="stack"><div class="card"><div class="hd"><h2>Recent runs</h2></div><div class="rows">${Run.slice(0,6).map(r=>`<button class="ri" data-alog="run|${esc(r._id)}">${dateBox(r.date)}<div><div class="t">${esc(genName(r.gen))} · ${r.hours} h</div><div class="m">${esc(r.prog||"")}${r.litres?` · ${r.litres} L`:""}</div></div><div class="r"></div></button>`).join("")||`<div class="empty">No runs logged.</div>`}</div></div>
   <div class="card"><div class="hd"><h2>Diesel purchases</h2></div><div class="rows">${D.slice(0,6).map(r=>`<button class="ri" data-alog="diesel|${esc(r._id)}">${dateBox(r.date)}<div><div class="t">${fmtN(r.litres)} L · ${naira(nn(r.litres)*nn(r.price))}</div><div class="m">${naira(r.price)}/L${r.supplier?" · "+esc(r.supplier):""}</div></div><div class="r"></div></button>`).join("")||`<div class="empty">No purchases logged.</div>`}</div></div>
   <div class="card"><div class="hd"><h2>Services & repairs</h2></div><div class="rows">${Sv.slice(0,6).map(r=>`<button class="ri" data-alog="service|${esc(r._id)}">${dateBox(r.date)}<div><div class="t">${esc(genName(r.gen))} · ${esc(r.type||"Service")}</div><div class="m">${naira(r.cost)}${r.notes?" · "+esc(r.notes):""}</div></div><div class="r"></div></button>`).join("")||`<div class="empty">No services logged.</div>`}</div></div></div></div>`;}

H8.alog=t=>{const[kind,id]=t.dataset.alog.split("|");const[title,fs]=ALOGF[kind];const x=id?{...((S.adminlog||[]).find(z=>z._id===id)||{})}:{kind,date:tISO(),source:"Electricity"};const ed=admEd();if(!ed&&!id)return;

function deprec(e){const cost=nn(e.cost),sal=nn(e.salvage),life=nn(e.life);if(!cost||!life||!e.buyDate)return {annual:0,acc:0,book:cost};const yrs=Math.max(0,((e.status==="Decommissioned"&&e.decomDate?new Date(e.decomDate):today())-new Date(e.buyDate))/(365.25*864e5));

 compose:(t)=>{comp=null;startCompose(t.dataset.compose,{pid:t.dataset.cpid,to:t.dataset.cto});},csel:(t)=>{const vis=S.contacts.filter(x=>!comp.area||x.area===comp.area).map(x=>x._id);comp.sel=t.dataset.csel==="all"?[...new Set([...comp.sel,...vis])]:[];render();},

const HK=Object.keys(H).map(k=>[k,"data-"+k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())]);const ALLSEL=HK.map(([,a])=>`[${a}]`).join(",");
document.addEventListener("click",e=>{if(e.target.closest("#themeBtn"))return toggleTheme();if(e.target.closest("#avatar"))return goPage("profile");if(e.target.closest("#gearBtn"))return goPage("general");if(e.target.closest("#burger"))return openDrawer();if(e.target.closest("#homeLogo"))return go("home","overview");if(e.target.closest("#bellBtn"))return goPage("alerts");if(e.target.closest("#helpFab"))return openSupport(me.id);
  if(e.target.closest("select,input,textarea,a[href],label.chk"))return;
  const t=e.target.closest(ALLSEL);if(!t)return;for(const[k,a]of HK)if(t.hasAttribute(a)){H[k](t,e);return;}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.querySelector(".run"))return;closeLayer();}if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-day],[data-month]")){e.preventDefault();e.target.click();}});
let qT;document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.lq){const k=t.dataset.lq;LST[k].q=t.value;LST[k].page=0;clearTimeout(qT);qT=setTimeout(()=>{lsave(k);render();},180);}
  else if(t.dataset.ctrn){ctr[t.dataset.ctrn]=Math.max(0,n(t.value));const tot=document.querySelector(".card .hd .n b");if(tot)tot.textContent=attTotal(ctr);}
  else if(t.dataset.cf&&comp){comp[t.dataset.cf]=t.value;if(["subject","body"].includes(t.dataset.cf)){clearTimeout(qT);qT=setTimeout(render,400);}}
  else if(t.dataset.ti!==undefined&&tplDraft){const[i,f]=t.dataset.ti.split("|");tplDraft.items[+i][f]=f==="off"?(t.value===""?"":Number(t.value)):t.value;}
  else if(t.dataset.sf!==undefined&&planDraft){const[i,f]=t.dataset.sf.split("|");planDraft.sections[+i][f]=t.value;planDirty=true;}
  else if(t.dataset.pm&&planDraft&&t.tagName==="INPUT"&&t.type==="text"){planDraft[t.dataset.pm]=t.value;planDirty=true;}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset.lf){const[k,f]=t.dataset.lf.split("|");LST[k].f[f]=t.value;LST[k].page=0;lsave(k);render();}
  else if(t.dataset.lsize){const k=t.dataset.lsize;LST[k].size=t.value==="All"?"All":Number(t.value);LST[k].page=0;lsave(k);render();}
  else if(t.id==="dashY"){LS.set("dashY",t.value);render();}else if(t.id==="growY"){LS.set("growY",t.value);render();}else if(t.id==="planY"){LS.set("planY",t.value);render();}
  else if(t.id==="lookSel"){saveSettings({look:Number(t.value)});}
  else if(["dS","dE","dD"].includes(t.id)){saveSettings({[t.id==="dS"?"pStart":t.id==="dE"?"pEnd":"deadline"]:t.value});}
  else if(t.dataset.astat){const a=S.actions.find(x=>x._id===t.dataset.astat);if(a){const d={...a,status:t.value};await save("actions",a._id,d);}}
  else if(t.dataset.p27){const[id,k]=t.dataset.p27.split("|");const p=progBy(id);if(p)await save("programs",id,{...p,[k]:t.value});}
  else if(t.dataset.ctr){ctr[t.dataset.ctr]=t.value;if(t.dataset.ctr!=="notes")render();}
  else if(t.dataset.cf&&comp){comp[t.dataset.cf]=t.value;if(t.dataset.cf==="tpl"){const tp=S.lettertpls.find(x=>x._id===t.value);if(tp){comp.subject=tp.subject||"";comp.body=tp.body||"";comp.kind=tp.kind;}}if(t.dataset.cf==="to")comp.sel=[t.value];render();}
  else if(t.id==="cArea"&&comp){comp.area=t.value;render();}
  else if(t.dataset.cpick&&comp){const id=t.dataset.cpick;comp.sel=t.checked?[...new Set([...comp.sel,id])]:comp.sel.filter(x=>x!==id);render();}
  else if(t.dataset.pm&&planDraft){planDraft[t.dataset.pm]=t.value;planDirty=true;render();}
  else if(t.dataset.lsel){const i=t.dataset.lsel.indexOf("|");const k=t.dataset.lsel.slice(0,i),id=t.dataset.lsel.slice(i+1);t.checked?LSEL[k].add(id):LSEL[k].delete(id);render();}
  else if(t.dataset.lpage){const k=t.dataset.lpage;const cfg=LCFG[k];const st=LST[k];const R=lrows(k,cfg);const size=st.size==="All"?R.length||1:Number(st.size);R.slice(st.page*size,st.page*size+size).forEach(r=>t.checked?LSEL[k].add(r._id):LSEL[k].delete(r._id));render();}
  else if(t.dataset.gsub){const[g,u]=t.dataset.gsub.split("|");const c=gcol(g,"crew").find(x=>x._id===u)||{};const d={...c,status:"member",sub:t.value,at:c.at||new Date().toISOString()};delete d._id;if(await setDoc(`teams/${g}/crew/${u}`,d))toast("Role updated");}
  else if(t.dataset.themeSet){LS.set("theme",t.dataset.themeSet);applyTheme();render();}});
async function copyText(txt,el){try{await navigator.clipboard.writeText(txt);toast("Copied");}catch(e){if(el&&el.select){el.select();toast("Selected – press copy");}else if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected – press copy");}else toast("Copy isn't available here");}}
window.addEventListener("beforeunload",e=>{if(planDirty){e.preventDefault();e.returnValue="";}});
(function init(){const r=routeFromHash();if(r)route=r;try{history.replaceState({r:route},"",routeHash(route));}catch(e){}if(window.HOH_WEB)window.__startApp=boot;else boot();})();

function importCard(){return `<div class="boot"><div class="card" style="max-width:520px"><div class="bd stack" style="text-align:center"><img src="${LOGO}" alt="" style="margin:0 auto;width:72px;height:72px;border-radius:50%"><h2 style="margin:0">Welcome to ${APP}</h2><p class="muted" style="margin:0">The database is empty. Bring in everything from the Claude version – programs from 2024 to 2026, actions, templates, the address book and settings.</p><label class="btn pri" style="margin:0 auto;cursor:pointer">Choose the HOH data file<input type="file" id="impFile" accept=".json,application/json" hidden></label><div class="small muted">Pick <b>hoh-data.json</b> – the file Claude sent you.</div><div class="small muted" id="impMsg"></div></div></div></div>`;}
document.addEventListener("change",async e=>{if(e.target.id!=="impFile")return;const fl=e.target.files[0];const msg=document.getElementById("impMsg");if(!fl)return;
  try{const data=JSON.parse(await fl.text());let n2=0;const tot=Object.values(data).reduce((s,c)=>s+Object.keys(c).length,0);
    for(const[c,docs]of Object.entries(data))for(const[id,d]of Object.entries(docs)){if(c==="settings")await db.doc("settings/"+id).set(d);else await db.collection(c).doc(id).set(d);n2++;if(n2%10===0)msg.textContent=`Imported ${n2} of ${tot}…`;}
    msg.textContent=`Done – ${n2} records imported.`;toast("Import complete");setTimeout(rerender,800);}catch(err){msg.textContent="Import failed: "+(err.message||err.code||"unknown error")+". Check that the security rules are published, then try again.";}});

})();
</script>
